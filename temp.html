@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap');

:root {
  --font-display: 'Outfit', sans-serif;
  --font-body: 'Inter', sans-serif;
  --font-display-ar: 'Cairo', sans-serif;
  --font-body-ar: 'Cairo', sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  --bg: #070910;
  --surface: #11182a;
  --surface2: #15213a;
  --line: #2b3a5d;
  --text: #f4f7ff;
  --muted: #9fb0d4;
  --a: #FF4433;
  --b: #8A2BE2;
  --brand-accent: #FF4433;
  --brand-accent-glow: rgba(255, 68, 51, 0.4);
  --ok: #32c58d;
  --danger: #ee4a77;
  --shadow: 0 16px 46px rgba(0,0,0,.30);
  --shadow-sm: 0 4px 12px rgba(0,0,0,.20);
  --radius: .72rem;
  --radius-lg: 1rem;
  --radius-full: 9999px;
}
html[data-theme="light"] {
  --bg: #eff3ff;
  --surface: #fff;
  --surface2: #f7f9ff;
  --line: #d8e2f1;
  --text: #121a2d;
  --muted: #5b6c89;
  --shadow: 0 14px 34px rgba(35,56,97,.13);
  --shadow-sm: 0 2px 8px rgba(35,56,97,.08);
  /* Make the mesh gradients much softer in light mode for a sleek look */
  --a: #ff786b;
  --b: #a461e8;
  --brand-accent-glow: rgba(255, 68, 51, 0.15);
}

* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  max-width: 100%;
}
html.mobile-menu-open,
body.mobile-menu-open {
  overflow: hidden;
}
body {
  font-family: var(--font-body);
  background: radial-gradient(1200px 500px at 92% -20%, color-mix(in oklab,var(--b) 25%,transparent), transparent 60%),
              radial-gradient(900px 420px at -5% 0%, color-mix(in oklab,var(--a) 18%,transparent), transparent 58%),
              var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

html[dir="rtl"] body {
  direction: rtl;
  font-family: var(--font-body-ar);
}

html[dir="rtl"] h1,
html[dir="rtl"] h2,
html[dir="rtl"] h3,
html[dir="rtl"] h4,
html[dir="rtl"] h5,
html[dir="rtl"] h6,
html[dir="rtl"] .font-display {
  font-family: var(--font-display-ar);
}

.container { width: min(1200px, 92%); margin: 0 auto; }

img, svg, video, canvas, iframe {
  max-width: 100%;
  height: auto;
}

h1, h2, h3, h4, h5, h6, .font-display {
  font-family: var(--font-display);
  font-weight: 800;
  /* letter-spacing: -0.04em; */
  line-height: 1.1;
}

h1 {
  font-size: clamp(2.5rem, 5vw, 4rem);
  font-weight: 900;
  letter-spacing: -0.05em;
  line-height: 1.05;
}

html[dir="rtl"] h1,
html[dir="rtl"] h2,
html[dir="rtl"] h3,
html[dir="rtl"] h4,
html[dir="rtl"] h5,
html[dir="rtl"] h6 {
  letter-spacing: 0;
  line-height: 1.2;
}

/* Recolor the hero graphic to match the new vibrant brand palette (#FF4433, #8A2BE2) */
.hero-art img {
  /* Removed hue shift as new graphic matches native palette */
}

/* ===== HEADER STYLES ===== */
.app-header {
  position: sticky;
  top: 0;
  z-index: 100;
  margin: 0;
  padding: 0;
  width: 100%;
  background: color-mix(in oklab, var(--bg) 75%, transparent);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid color-mix(in oklab, var(--line) 60%, transparent);
}

.header-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  min-height: 64px;
  width: 100%;
  max-width: 1400px;
  margin: 0 auto;
  padding: 0 clamp(1rem, 2vw, 1.5rem);
}

.brand {
  display: flex;
  align-items: center;
  gap: .55rem;
  text-decoration: none;
  color: var(--text);
  font-weight: 800;
  font-size: 1.15rem;
}

.brand-icon {
  width: 1.6rem;
  height: 1.6rem;
  display: flex;
  align-items: center;
  justify-content: center;
}

.brand-icon svg {
  width: 100%;
  height: 100%;
  fill: currentColor;
}

.brand-text {
  background: linear-gradient(135deg, var(--a), var(--b));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  white-space: nowrap;
}

.text-gradient-accent {
  color: var(--brand-accent);
}

/* Desktop Navigation */
.desktop-nav {
  display: flex;
  align-items: center;
  gap: .25rem;
}

.nav-link {
  display: inline-flex;
  align-items: center;
  padding: .5rem .85rem;
  border-radius: var(--radius);
  font-size: .95rem;
  font-weight: 600;
  color: var(--muted);
  text-decoration: none;
  transition: all .2s ease;
}

.nav-link:hover {
  color: var(--text);
  background: color-mix(in oklab, var(--surface) 70%, transparent);
}

.nav-link.active {
  color: var(--text);
  background: var(--surface);
  box-shadow: var(--shadow-sm);
}

/* Header Actions */
.header-actions {
  display: flex;
  align-items: center;
  gap: .65rem;
}

.locale-switch,
.mobile-locale-switch {
  display: inline-flex;
  align-items: center;
  gap: .35rem;
}

.locale-link {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: .35rem .55rem;
  border-radius: var(--radius-full);
  border: 1px solid var(--line);
  background: color-mix(in oklab, var(--surface) 70%, transparent);
  color: var(--muted);
  text-decoration: none;
  font-size: .78rem;
  font-weight: 700;
  transition: all .2s ease;
}

.locale-link:hover {
  color: var(--text);
  border-color: color-mix(in oklab, var(--a) 40%, var(--line));
}

.locale-link.active {
  color: #fff;
  border-color: transparent;
  background: linear-gradient(135deg, var(--a), var(--b));
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-body);
  font-weight: 600;
  font-size: 0.95rem;
  padding: 0.85rem 1.8rem;
  border-radius: 99px;
  border: 1px solid var(--line);
  background: color-mix(in oklab, var(--surface) 80%, transparent);
  color: var(--text);
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  text-decoration: none;
  line-height: 1.2;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

.btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 24px color-mix(in oklab, var(--line) 40%, transparent);
}

.btn-primary {
  background: linear-gradient(135deg, var(--a), var(--b));
  border: none;
  color: #fff;
  box-shadow: 0 4px 12px color-mix(in oklab, var(--a) 25%, transparent);
}

.btn-primary:hover {
  box-shadow: 0 12px 32px color-mix(in oklab, var(--a) 45%, transparent), 0 0 0 2px color-mix(in oklab, var(--b) 30%, transparent);
}

.btn-ghost {
  background: transparent;
  border-color: transparent;
  color: var(--text);
}

.btn-ghost:hover {
  box-shadow: 0 12px 24px color-mix(in oklab, var(--line) 40%, transparent);
}

.btn-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 2.35rem;
  height: 2.35rem;
  padding: 0;
  border-radius: var(--radius);
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--text);
  cursor: pointer;
  transition: all .2s ease;
}

.btn-icon:hover {
  background: color-mix(in oklab, var(--surface2) 80%, transparent);
  color: var(--text);
}

.btn-icon .icon {
  width: 1.05rem;
  height: 1.05rem;
  stroke: currentColor;
  fill: currentColor;
  stroke-width: 2;
}

.theme-toggle .sun { display: none; }
html[data-theme="light"] .theme-toggle .sun
