<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;700;800&display=block" rel="stylesheet">
<style>
:root{--ink:#0f1020;--ink2:#555a6e;--accent:#7659FA}
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{font-family:Alexandria,Tahoma,sans-serif;background:#fff;position:relative;color:var(--ink)}
.glow{position:absolute;inset:0;background:radial-gradient(560px 360px at 50% 52%, rgba(118,89,250,.14), transparent 72%),radial-gradient(900px 300px at 50% 100%, rgba(118,89,250,.07), transparent 70%)}
.mid{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:640px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:22px}
.logo{height:50px}
h1{font-weight:800;font-size:60px;line-height:1.16;letter-spacing:-.5px;white-space:nowrap}
h1 span{display:block;color:var(--accent)}
html[lang=en] h1{font-size:52px}
p{font-size:23px;line-height:1.5;color:var(--ink2)}
.url{font-size:19px;color:var(--accent);font-weight:500;direction:ltr}
.av{position:absolute;width:132px;height:132px;border-radius:50%;overflow:hidden;border:5px solid #fff;box-shadow:0 10px 26px rgba(20,16,60,.16)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.lead{outline:4px solid var(--accent)}
.dash{position:absolute;inset:0}
</style></head><body>
<div class="glow"></div>
<svg class="dash" width="1200" height="630"><path d="M150 120 Q 70 315 150 510" fill="none" stroke="#d9d2fe" stroke-width="2" stroke-dasharray="6 7"/><path d="M1050 120 Q 1130 315 1050 510" fill="none" stroke="#d9d2fe" stroke-width="2" stroke-dasharray="6 7"/></svg>
<div id="avs"></div>
<div class="mid"><img class="logo" id="logo" alt=""><h1 id="h1"></h1><p id="sub"></p><div class="url">listenai.studio</div></div>
<script>
const lang = new URLSearchParams(location.search).get('lang') || 'ar';
const T = {
  ar:{dir:'rtl',logo:'../../public/images/logo-ar-light.svg',a:'اكتب أي نص…',b:'واسمعه بأي لهجة',sub:'أكثر من 200 لهجة ولكنة، بأصوات تبدو بشرية تماماً.',av:['ar-sultan','ar-sumaya','ar-nawaf','ar-sawsan','ar-aisha']},
  en:{dir:'ltr',logo:'../../public/images/logo-light.svg',a:'Type anything.',b:'Hear it in any accent.',sub:'200+ accents, in voices that sound truly human.',av:['en-daisy','en-theodore','en-charlie','en-miles','en-luna']},
}[lang];
document.documentElement.lang = lang; document.documentElement.dir = T.dir;
document.getElementById('logo').src = T.logo;
document.getElementById('h1').innerHTML = T.a + '<span>' + T.b + '</span>';
document.getElementById('sub').textContent = T.sub;
// Two speakers on each side, the lead one top right (Arabic) or top left (English), where the eye starts.
const spots = [[1050,120],[1050,510],[150,120],[150,510]];
const lead = T.dir === 'rtl' ? 0 : 2;
const order = T.dir === 'rtl' ? [0,1,2,3] : [2,3,0,1];
order.forEach((s, i) => { const [x,y] = spots[s]; const d = document.createElement('div');
  d.className = 'av' + (s === lead ? ' lead' : ''); d.style.left = (x-66)+'px'; d.style.top = (y-66)+'px';
  d.innerHTML = `<img src="../../public/images/speakers/${T.av[i]}.webp" alt="">`; document.getElementById('avs').appendChild(d); });
</script></body></html>
