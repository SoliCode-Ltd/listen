; PHP limits for the site's own pages, read by the web server's PHP (it looks
; at this file again every few minutes). The "Server deploy" workflow's
; php-limits mode shows what is in use.
;
; Memory: a long text's voice is joined in memory; the longest (50,000
; characters, close to an hour of audio) need about 400 MB. Voices made after
; the reply raise it further for themselves.
memory_limit = 512M

; Uploads: voice cloning sends two recordings of up to 25 MB each in one form.
upload_max_filesize = 64M
post_max_size = 64M
max_input_time = 300
