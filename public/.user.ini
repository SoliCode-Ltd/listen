; PHP limits for the site's own pages, read by the web server's PHP (it looks
; at this file again every few minutes). The "Server deploy" workflow's
; php-limits mode shows what is in use.
;
; Where the host fixes a limit for the site (live: 256 MB, 32 MB, 40 MB), the
; host's value wins and this file changes nothing.
;
; Memory: the longest voices (50,000 characters, close to an hour of audio)
; are joined on disk and stay under 100 MB above the app; 512 MB leaves room.
memory_limit = 512M

; Uploads: "Dub my video" takes videos up to 300 MB (Video Dubbing ->
; Settings sets less); post_max_size leaves room for the rest of the form.
; Voice cloning's two recordings (up to 25 MB each) fit well within it.
; A large video on a slow connection takes minutes to arrive: 15 allowed.
upload_max_filesize = 300M
post_max_size = 310M
max_input_time = 900
