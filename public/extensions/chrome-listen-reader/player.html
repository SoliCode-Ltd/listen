<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Listen Player</title>
  <style>
    :root {
      --bg: #0B0B0F;
      --surface: #1A1A22;
      --surface2: #121218;
      --line: #2A2A35;
      --text: #FFFFFF;
      --muted: #A1A1AA;
      --brandA: #7659FA;
      --brandB: #5B3DF5;
    }

    body {
      margin: 0;
      padding: 18px;
      font: 14px/1.45 IBM Plex Sans, Inter, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .card {
      max-width: 760px;
      margin: 0 auto;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--surface);
      box-shadow: 0 18px 34px rgba(0, 0, 0, 0.28);
    }

    h1 {
      margin: .1rem 0 .5rem;
      font-size: 1.15rem;
      color: var(--brandA);
    }

    p {
      margin: .3rem 0;
      color: var(--muted);
    }

    audio {
      width: 100%;
      margin-top: .8rem;
      accent-color: var(--brandA);
    }

    .hint {
      margin-top: .6rem;
      font-size: .95rem;
      color: var(--muted);
      opacity: 0.9;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Listen Player</h1>
    <p id="textPreview">Preparing audio...</p>
    <audio id="audio" controls autoplay preload="auto"></audio>
    <div class="hint">Keep this tab open while listening.</div>
  </div>

  <script src="player.js"></script>
</body>

</html>
