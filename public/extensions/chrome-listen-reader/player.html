<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Listen Player</title>
  <style>
    :root {
      --bg: #070910;
      --surface: #11182a;
      --surface2: #15213a;
      --line: #2b3a5d;
      --text: #f4f7ff;
      --muted: #9fb0d4;
      --brandA: #FF4433;
      --brandB: #8A2BE2;
    }

    body {
      margin: 0;
      padding: 18px;
      font: 14px/1.45 Inter, Segoe UI, Roboto, Arial, sans-serif;
      background:
        radial-gradient(400px 300px at 90% -10%, rgba(138, 43, 226, 0.15), transparent 60%),
        radial-gradient(300px 200px at -10% -10%, rgba(255, 68, 51, 0.12), transparent 60%),
        var(--bg);
      color: var(--text);
    }

    .card {
      max-width: 760px;
      margin: 0 auto;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background:
        linear-gradient(135deg, rgba(255, 68, 51, 0.09), rgba(138, 43, 226, 0.11)),
        linear-gradient(180deg, rgba(21, 33, 58, 0.94), rgba(17, 24, 42, 0.97));
      box-shadow: 0 18px 34px rgba(0, 0, 0, 0.28);
    }

    h1 {
      margin: .1rem 0 .5rem;
      font-size: 1.15rem;
      background: linear-gradient(135deg, var(--brandA), var(--brandB));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    p {
      margin: .3rem 0;
      color: var(--muted);
    }

    audio {
      width: 100%;
      margin-top: .8rem;
      accent-color: var(--brandA);
    }

    .hint {
      margin-top: .6rem;
      font-size: .88rem;
      color: var(--muted);
      opacity: 0.9;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Listen Player</h1>
    <p id="textPreview">Preparing audio...</p>
    <audio id="audio" controls autoplay preload="auto"></audio>
    <div class="hint">Keep this tab open while listening.</div>
  </div>

  <script src="player.js"></script>
</body>

</html>
