<!doctype html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Listen Reader</title>
  <link rel="stylesheet" href="popup.css" />
</head>

<body>
  <main class="app">
    <header class="head">
      <div class="head-row">
        <h1 data-i18n="extName">Listen Reader</h1>
        <button id="langSwitcher" class="lang-btn" type="button" title="Switch Language">عربي</button>
      </div>
      <p data-i18n="headerSubtitle">Select text anywhere and listen instantly.</p>
    </header>

    <p id="status" class="status"></p>

    <section class="panel profile">
      <div class="row-inline">
        <div class="avatar" id="userAvatar">L</div>
        <div class="profile-info">
          <div class="name" id="userName">Connect your account</div>
          <div class="small" id="userPlan">Plan: -</div>
        </div>
      </div>
      <div class="credits-row">
        <img class="coin" src="credit-coin.webp" alt="" width="40" height="30" />
        <div>
          <div class="small" data-i18n="charactersLabel">Credits left</div>
          <div class="credits-value" id="creditsValue">-</div>
        </div>
      </div>
      <div class="bar"><span id="charsBar"></span></div>
      <div class="usage-lines">
        <div class="small" id="minutesText"></div>
        <div class="small" id="todayText"></div>
        <div class="small" id="requestsText"></div>
      </div>
      <div class="credits-note" id="creditsNote"></div>
      <div class="plan-links">
        <a id="planLink" href="#" target="_blank" rel="noopener" hidden data-i18n="managePlan">Manage plan</a>
        <a id="dashboardLink" href="#" target="_blank" rel="noopener" hidden data-i18n="openDashboard">Dashboard</a>
      </div>
    </section>

    <section class="panel settings">
      <label><span data-i18n="apiKeyLabel">API Key</span>
        <input id="apiKey" type="password" data-i18n-placeholder="apiKeyPlaceholder" placeholder="Paste your API key here" />
      </label>

      <label><span data-i18n="voiceLanguage">Voice Language</span>
        <select id="targetLanguage">
          <option value="ar" data-i18n="arabic">Arabic</option>
          <option value="en" data-i18n="english">English</option>
        </select>
      </label>

      <label><span data-i18n="speaker">Speaker</span>
        <select id="voiceKey"></select>
      </label>

      <div id="studioPanel" class="studio-panel" style="display:none;">
        <div class="studio-label">🎛️ <span data-i18n="studioLabel">Voice Studio (Premium)</span></div>
        <label class="studio-full-width"><span data-i18n="dialect">Dialect</span>
          <select id="dialect"></select>
        </label>
        <div class="studio-grid">
          <label><span data-i18n="performanceStyle">Performance Style</span>
            <select id="performanceStyle"></select>
          </label>
          <label><span data-i18n="emotion">Emotion</span>
            <select id="emotion"></select>
          </label>
        </div>
      </div>

      <div class="setting-card">
        <div class="setting-info">
          <label id="translateLabel" for="translate" data-i18n="translateLabel">Translate before speaking</label>
        </div>
        <label class="toggle-switch" aria-label="Translate before speaking">
          <input id="translate" type="checkbox" />
          <span class="toggle-slider"></span>
        </label>
      </div>

      <div class="setting-card">
        <div class="setting-info">
          <label for="autoPlay" data-i18n="autoPlayLabel">Play voice in side panel</label>
        </div>
        <label class="toggle-switch" aria-label="Play voice in side panel">
          <input id="autoPlay" type="checkbox" />
          <span class="toggle-slider"></span>
        </label>
      </div>

      <button id="saveBtn" class="btn" data-i18n="saveBtn">Save settings</button>
      <button id="selectionBtn" class="btn primary" data-i18n="readSelectionBtn">Read current selection</button>
    </section>

    <section class="panel">
      <label><span data-i18n="quickTextLabel">Quick text (optional)</span>
        <textarea id="quickText" dir="auto" rows="4" data-i18n-placeholder="quickTextPlaceholder" placeholder="Paste any text and click Read quick text"></textarea>
        <div class="char-counter" id="charCounter">
          <span id="charCount">0</span> / <span id="charLimit">-</span> <span data-i18n="characters">characters</span>
        </div>
        <div class="credit-estimate" id="creditEstimate"></div>
      </label>
      <button id="quickBtn" class="btn" data-i18n="readQuickBtn">Read quick text</button>
    </section>
  </main>

  <script src="popup.js"></script>
</body>

</html>
