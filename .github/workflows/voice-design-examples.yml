name: Voice Design examples

# Records the example characters on the Voice Design card (php artisan
# voice-design:examples): each is designed from its description in
# lang/en/voice_design.php and says its line, into
# public/audio/voice-design/examples/*.mp3, committed back to this branch.
# The voices are deleted again at once; only the clips are kept. Uses the
# Gemini keys from STAGING's .env (key 1 first; when one runs out the next
# carries on, the last key is left for live), read over SSH, masked in the log
# and never stored. Speech requests count against the quota staging shares
# with live (two a clip): run it by hand, on the branch to commit to, only
# when the owner asks.

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Examples to make, by key, space-separated (empty: every example not made yet)'
        type: string
        default: ''
      force:
        description: 'Make the named examples again even if their clips exist'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: voice-design-examples
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, intl, mbstring, pdo_sqlite, sqlite3, gd, zip
          coverage: none

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null

      - name: Install dependencies
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          cp .env.example .env
          php artisan key:generate --no-interaction
          touch database/database.sqlite
          php artisan migrate --force --no-interaction > /dev/null

      - name: Record with the staging keys
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          APP_PATH: ${{ secrets.STAGING_APP_PATH }}
          ONLY: ${{ inputs.only }}
          FORCE: ${{ inputs.force && '--force' || '' }}
          CACHE_STORE: array
        run: |
          set -euo pipefail
          SSH_HOST="$(printf '%s' "$SSH_HOST" | tr -d '[:space:]')"
          SSH_USER="$(printf '%s' "$SSH_USER" | tr -d '[:space:]')"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_gen
          chmod 600 ~/.ssh/id_gen
          ssh-keyscan -T 15 -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # Every key in order (GEMINI_TTS_API_KEY, then _2, _3 ...), values only, one per line.
          remote="for d in ${APP_PATH:+'$APP_PATH'} ~/public_html ~; do [ -f \"\$d/artisan\" ] && cd \"\$d\" && break; done; grep -E '^GEMINI_TTS_API_KEY(_[0-9]+)?=' .env | sed -E 's/^GEMINI_TTS_API_KEY=/GEMINI_TTS_API_KEY_1=/' | sort -t_ -k5 -n | cut -d= -f2-"
          mapfile -t RAW < <(ssh -i ~/.ssh/id_gen -o BatchMode=yes -o ConnectTimeout=20 "$SSH_USER@$SSH_HOST" "$remote")
          rm -f ~/.ssh/id_gen
          KEYS=()
          for k in "${RAW[@]}"; do
            k="$(printf '%s' "$k" | tr -d "\"' \r\n")"
            [ -z "$k" ] && continue
            echo "::add-mask::$k"
            dup=0; for seen in "${KEYS[@]}"; do [ "$seen" = "$k" ] && dup=1; done
            [ "$dup" = 0 ] && KEYS+=("$k")
          done
          if [ "${#KEYS[@]}" -eq 0 ]; then echo "No GEMINI_TTS_API_KEY on staging"; exit 1; fi
          last=${#KEYS[@]}; [ "$last" -gt 1 ] && last=$((last - 1))
          only=""; for s in $(printf '%s' "$ONLY" | tr -cd 'a-z0-9_ '); do only="$only --only=$s"; done
          # Each key makes what is still missing (--force only on the first pass: later keys finish the rest).
          for (( n = 1; n <= last; n++ )); do
            echo "--- key $n of ${#KEYS[@]}"
            out="$(php artisan voice-design:examples --key="${KEYS[$((n - 1))]}" $only $FORCE 2>&1 || true)"
            printf '%s\n' "$out" | grep -v '^REPORT ' | cut -c1-200
            printf '%s\n' "$out" | grep '^REPORT ' | sed 's/^REPORT //' > "report-$n.json" || true
            FORCE=""
            grep -qE 'not made|HTTP 429|RESOURCE_EXHAUSTED' <<<"$out" || break
          done
          echo "== What each clip took (statuses, times, token use) =="
          cat report-*.json 2>/dev/null || true

      - name: Commit the clips
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/audio/voice-design/examples/*.mp3
          if git diff --cached --quiet; then echo "No new clips"; exit 1; fi
          git diff --cached --stat
          git commit -m "Voice Design: record the example characters for the card" -m "${{ inputs.only || 'every example' }}"
          git pull --rebase origin "${GITHUB_REF#refs/heads/}"
          git push origin HEAD:${GITHUB_REF#refs/heads/}
