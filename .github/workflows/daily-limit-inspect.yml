name: Daily limit inspect

# Read-only: why a member made more generations in a day than their plan allows, on LIVE.
# Pipes scripts/support/daily_limit_inspect.php over SSH into the app's own
# PHP (READ ONLY database session). The member is named by the SHA-256 of
# their lower-cased email, so no address is stored in the repository; other
# members' emails are masked in the output. Nothing is written. Run by hand,
# naming the member each time.

on:
  workflow_dispatch:
    inputs:
      email_sha256:
        description: SHA-256 of the member's lower-cased email
        required: true

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect live over SSH
        env:
          EMAIL_SHA256: ${{ inputs.email_sha256 }}
          SSH_HOST: ${{ secrets.LIVE_SSH_HOST }}
          SSH_USER: ${{ secrets.LIVE_SSH_USER }}
          SSH_KEY: ${{ secrets.LIVE_SSH_KEY }}
          APP_PATH: ${{ secrets.LIVE_APP_PATH }}
        run: |
          set -euo pipefail
          [[ "$EMAIL_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::email_sha256 must be 64 hex characters"; exit 1; }
          SSH_HOST="$(printf '%s' "$SSH_HOST" | tr -d '[:space:]')"
          SSH_USER="$(printf '%s' "$SSH_USER" | tr -d '[:space:]')"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_inspect
          chmod 600 ~/.ssh/id_inspect
          ssh-keyscan -T 15 -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          remote="for d in ${APP_PATH:+'$APP_PATH'} ~/public_html ~; do [ -f \"\$d/artisan\" ] && cd \"\$d\" && break; done; ACCOUNT_EMAIL_SHA256=$EMAIL_SHA256 \$(command -v php8.4 || command -v php)"
          ssh -i ~/.ssh/id_inspect -o BatchMode=yes -o ConnectTimeout=20 "$SSH_USER@$SSH_HOST" "$remote" < scripts/support/daily_limit_inspect.php

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/id_inspect
