name: Hero voices generate

# Makes the homepage clips named in the slugs input (hero clips from
# App\Support\HeroCast, or samples from database/seeders/data/showcase_samples.php)
# with this branch's lines, using Gemini key 1 from STAGING's .env
# (GEMINI_TTS_API_KEY, the owner's choice), and commits the MP3s back to this
# branch. The key is read over SSH, masked in the log and never stored.
# Speech requests count against that key's quota, which staging shares with
# live: run it by hand (on the branch to commit to), only when the owner asks.

on:
  workflow_dispatch:
    inputs:
      slugs:
        description: 'Clips to make, by slug, space-separated (hero clips or homepage samples, e.g. ar-sy-aleppo-kibbeh)'
        type: string
        default: 'hero-ar-sultan'

permissions:
  contents: write

concurrency:
  group: hero-voices-generate
  cancel-in-progress: false

env:
  SLUGS: ${{ inputs.slugs || 'hero-ar-sultan' }}

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, intl, mbstring, pdo_sqlite, sqlite3, gd, zip
          coverage: none

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null

      - name: Install dependencies
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: Generate with staging key 1
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          APP_PATH: ${{ secrets.STAGING_APP_PATH }}
        run: |
          set -euo pipefail
          SSH_HOST="$(printf '%s' "$SSH_HOST" | tr -d '[:space:]')"
          SSH_USER="$(printf '%s' "$SSH_USER" | tr -d '[:space:]')"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_gen
          chmod 600 ~/.ssh/id_gen
          ssh-keyscan -T 15 -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          remote="for d in ${APP_PATH:+'$APP_PATH'} ~/public_html ~; do [ -f \"\$d/artisan\" ] && cd \"\$d\" && break; done; grep -E '^GEMINI_TTS_API_KEY(_1)?=' .env | head -n 1 | cut -d= -f2-"
          KEY="$(ssh -i ~/.ssh/id_gen -o BatchMode=yes -o ConnectTimeout=20 "$SSH_USER@$SSH_HOST" "$remote" | tr -d "\"' \r\n")"
          rm -f ~/.ssh/id_gen
          if [ -z "$KEY" ]; then echo "No GEMINI_TTS_API_KEY on staging"; exit 1; fi
          echo "::add-mask::$KEY"
          echo "Using staging key 1 (ending ${KEY: -4})"
          only=""; for s in $(printf '%s' "$SLUGS" | tr -cd 'a-z0-9 -'); do only="$only --only=$s"; done
          php artisan tts:showcase --generate --force --pause=20 --key="$KEY" $only 2>&1 | grep -v '^\*' | cut -c1-160

      - name: Commit the clips
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/audio/showcase/*.mp3
          if git diff --cached --quiet; then echo "No new clips"; exit 1; fi
          git diff --cached --stat
          git commit -m "Homepage clips: $SLUGS made with staging key 1"
          git pull --rebase origin "${GITHUB_REF#refs/heads/}"
          git push origin HEAD:${GITHUB_REF#refs/heads/}
