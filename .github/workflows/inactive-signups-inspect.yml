name: Inactive sign-ups inspect

# Read-only: what recent sign-ups did on LIVE, and why many never make a voice.
# Pipes scripts/support/inactive_signups_inspect.php over SSH into the app's own
# PHP (READ ONLY database session). No names, emails or full IPs are printed.
# Nothing is written.

on:
  workflow_dispatch:
    inputs:
      days:
        description: How many days of sign-ups to look at
        required: false
        default: '30'
  push:
    branches: [ccr-133b8b13-pcl57v]
    paths:
      - .github/workflows/inactive-signups-inspect.yml
      - scripts/support/inactive_signups_inspect.php

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect live over SSH
        env:
          SIGNUP_DAYS: ${{ inputs.days || '30' }}
          SSH_HOST: ${{ secrets.LIVE_SSH_HOST }}
          SSH_USER: ${{ secrets.LIVE_SSH_USER }}
          SSH_KEY: ${{ secrets.LIVE_SSH_KEY }}
          APP_PATH: ${{ secrets.LIVE_APP_PATH }}
        run: |
          set -euo pipefail
          [[ "$SIGNUP_DAYS" =~ ^[0-9]{1,3}$ ]] || { echo "::error::days must be a number"; exit 1; }
          SSH_HOST="$(printf '%s' "$SSH_HOST" | tr -d '[:space:]')"
          SSH_USER="$(printf '%s' "$SSH_USER" | tr -d '[:space:]')"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_inspect
          chmod 600 ~/.ssh/id_inspect
          ssh-keyscan -T 15 -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          remote="for d in ${APP_PATH:+'$APP_PATH'} ~/public_html ~; do [ -f \"\$d/artisan\" ] && cd \"\$d\" && break; done; SIGNUP_DAYS=$SIGNUP_DAYS \$(command -v php8.4 || command -v php)"
          ssh -i ~/.ssh/id_inspect -o BatchMode=yes -o ConnectTimeout=20 "$SSH_USER@$SSH_HOST" "$remote" < scripts/support/inactive_signups_inspect.php

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/id_inspect
