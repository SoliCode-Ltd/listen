name: Agent voice test

# Live voice test for Listen agents (scripts/agents/live_voice_test.mjs): four
# receptionists (two Egyptian, two Saudi) each answer two caller questions
# over a real-time voice session opened with a short-lived key, the way the
# agent widget will. Keeps the replies (MP3), the delay to the first sound,
# what each one said and the tokens used, with the run.
#
# Uses the first Gemini key from STAGING's .env, read over SSH, masked in the
# log and never stored. It makes about a minute of audio from the quota staging
# shares with live: the owner approved this test (about 10 minutes at most).

on:
  workflow_dispatch:
  push:
    branches: [claude/beautiful-sagan-df90b3]
    paths:
      - .github/workflows/agent-voice-test.yml
      - scripts/agents/live_voice_test.mjs

permissions:
  contents: read

concurrency:
  group: agent-voice-test
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Talk to the live voice with a staging key
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          APP_PATH: ${{ secrets.STAGING_APP_PATH }}
        run: |
          set -euo pipefail
          SSH_HOST="$(printf '%s' "$SSH_HOST" | tr -d '[:space:]')"
          SSH_USER="$(printf '%s' "$SSH_USER" | tr -d '[:space:]')"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_test
          chmod 600 ~/.ssh/id_test
          ssh-keyscan -T 15 -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # The first key only (GEMINI_TTS_API_KEY), value only.
          remote="for d in ${APP_PATH:+'$APP_PATH'} ~/public_html ~; do [ -f \"\$d/artisan\" ] && cd \"\$d\" && break; done; grep -E '^GEMINI_TTS_API_KEY=' .env | head -1 | cut -d= -f2-"
          KEY="$(ssh -i ~/.ssh/id_test -o BatchMode=yes -o ConnectTimeout=20 "$SSH_USER@$SSH_HOST" "$remote" | tr -d "\"' \r\n")"
          rm -f ~/.ssh/id_test
          if [ -z "$KEY" ]; then echo "No GEMINI_TTS_API_KEY on staging"; exit 1; fi
          echo "::add-mask::$KEY"
          LIVE_KEY="$KEY" node scripts/agents/live_voice_test.mjs out

      - name: Make the replies easy to play (MP3)
        if: always()
        run: |
          set -uo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          for f in out/*.wav; do [ -f "$f" ] && ffmpeg -loglevel error -y -i "$f" -codec:a libmp3lame -q:a 3 "${f%.wav}.mp3"; done
          ls -la out || true
          echo "== results =="
          cat out/results.json 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-voice-test
          path: |
            out/*.mp3
            out/results.json
          if-no-files-found: ignore
          retention-days: 14
