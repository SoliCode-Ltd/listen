name: Vocal tags check

# Live check of Gemini 3.8 sound tags on STAGING only.
# Pipes scripts/tts/vocal_tags_check.php (plus this branch's GeminiVocalTags)
# over SSH into the staging app's PHP, which calls Gemini with its own key.
# Nothing is deployed and nothing is written. The audio comes back as a
# downloadable artifact so it can be listened to.
#
# Uses the same secrets as the other staging checks:
#   STAGING_SSH_HOST, STAGING_SSH_USER, STAGING_SSH_KEY, optional STAGING_APP_PATH

on:
  workflow_dispatch:
  push:
    branches: [claude/serene-albattani-ksbqof]
    paths:
      - .github/workflows/vocal-tags-check.yml
      - scripts/tts/vocal_tags_check.php
      - app/Support/GeminiVocalTags.php

permissions:
  contents: read

concurrency:
  group: vocal-tags-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build the check script with this branch's code
        run: |
          set -euo pipefail
          {
            echo '<?php'
            sed -e '1d' -e 's/^namespace App\\Support;/namespace ListenUnderTest;/' app/Support/GeminiVocalTags.php
          } > under_test.php
          php -l under_test.php
          grep -q '^namespace ListenUnderTest;' under_test.php
          python3 - <<'PY'
          import base64
          code = base64.b64encode(open('under_test.php', 'rb').read()).decode()
          script = open('scripts/tts/vocal_tags_check.php').read()
          assert '__UNDER_TEST__' in script
          open('check.php', 'w').write(script.replace('__UNDER_TEST__', code))
          PY
          php -l check.php

      - name: Run against staging over SSH
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          APP_PATH: ${{ secrets.STAGING_APP_PATH }}
        run: |
          set -euo pipefail
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$SSH_KEY" ]; then
            echo "::error::Staging SSH secrets are not set."
            exit 1
          fi
          SSH_HOST="$(printf '%s' "$SSH_HOST" | tr -d '[:space:]')"
          SSH_USER="$(printf '%s' "$SSH_USER" | tr -d '[:space:]')"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_check
          chmod 600 ~/.ssh/id_check
          ssh-keyscan -T 15 -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          remote="for d in ${APP_PATH:+'$APP_PATH'} ~/public_html ~; do [ -f \"\$d/artisan\" ] && cd \"\$d\" && break; done; php"
          ssh -i ~/.ssh/id_check -o BatchMode=yes -o ConnectTimeout=20 "$SSH_USER@$SSH_HOST" "$remote" \
            < check.php > result.json
          rm -f ~/.ssh/id_check

      - name: Summarise and save the audio
        run: |
          set -euo pipefail
          mkdir -p audio
          python3 - <<'EOF'
          import base64, json, re, wave
          data = json.load(open('result.json'))
          print('Environment:', data['meta'])
          failures = 0
          seconds = {}
          for case in data['cases']:
              pcm = case.pop('pcm_base64', None)
              if pcm:
                  name = re.sub(r'[^A-Za-z0-9]+', '_', case['name']).strip('_') + '.wav'
                  with wave.open('audio/' + name, 'wb') as w:
                      w.setnchannels(1); w.setsampwidth(2); w.setframerate(case.get('sample_rate', 24000))
                      w.writeframes(base64.b64decode(pcm))
              seconds[case['name']] = case.get('audio_seconds') or 0
              failures += 0 if case['ok'] else 1
              status = 'OK  ' if case['ok'] else 'FAIL'
              print(f"{status} {case['name']:<22} HTTP {case.get('http_status')} finish={case.get('finish_reason')} {case.get('audio_seconds', 0):>5}s {case['latency_ms']:>6} ms")
              print(f"      sent:  {case['sent_text']}")
              print(f"      style: {case['style']!r}")
              if case.get('error'):
                  print(f"      error: {case['error']}")
          for lang in ('en', 'ar'):
              plain, tagged = seconds.get(f'{lang} plain', 0), seconds.get(f'{lang} tagged', 0)
              print(f"{lang}: plain {plain}s vs tagged {tagged}s (+{round(tagged - plain, 2)}s for the tags)")
          json.dump(data, open('summary.json', 'w'), ensure_ascii=False, indent=2)
          if failures:
              raise SystemExit(1)
          EOF

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vocal-tags-check-${{ github.run_number }}
          path: |
            audio/
            summary.json
          if-no-files-found: ignore
          retention-days: 14
