name: Voice list inspect

# Read-only: every voice in the studio's library on LIVE or STAGING (name,
# language, gender, engine voice, dialect, avatar, preview file), one JSON line
# each. Pipes scripts/support/voice_list_inspect.php over SSH into the app's own
# PHP (READ ONLY database session). Nothing is written. A push that changes
# this workflow or the script runs it on LIVE.

on:
  workflow_dispatch:
    inputs:
      target:
        description: Which server
        type: choice
        options: [live, staging]
        default: live
  push:
    branches: [claude/beautiful-sagan-df90b3]
    paths:
      - .github/workflows/voice-list-inspect.yml
      - scripts/support/voice_list_inspect.php

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: List the voices over SSH
        env:
          SSH_HOST: ${{ inputs.target == 'staging' && secrets.STAGING_SSH_HOST || secrets.LIVE_SSH_HOST }}
          SSH_USER: ${{ inputs.target == 'staging' && secrets.STAGING_SSH_USER || secrets.LIVE_SSH_USER }}
          SSH_KEY: ${{ inputs.target == 'staging' && secrets.STAGING_SSH_KEY || secrets.LIVE_SSH_KEY }}
          APP_PATH: ${{ inputs.target == 'staging' && secrets.STAGING_APP_PATH || secrets.LIVE_APP_PATH }}
        run: |
          set -euo pipefail
          SSH_HOST="$(printf '%s' "$SSH_HOST" | tr -d '[:space:]')"
          SSH_USER="$(printf '%s' "$SSH_USER" | tr -d '[:space:]')"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_inspect
          chmod 600 ~/.ssh/id_inspect
          ssh-keyscan -T 15 -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          remote="for d in ${APP_PATH:+'$APP_PATH'} ~/public_html ~; do [ -f \"\$d/artisan\" ] && cd \"\$d\" && break; done; \$(command -v php8.4 || command -v php)"
          ssh -i ~/.ssh/id_inspect -o BatchMode=yes -o ConnectTimeout=20 "$SSH_USER@$SSH_HOST" "$remote" < scripts/support/voice_list_inspect.php

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/id_inspect
