name: Agent live call test

# Checks a whole Listen agent call for real (scripts/agents/live_agent_test.mjs):
# the agent's setup, as `php artisan agents:live-setup` builds it, locked
# into a short-lived key; a different setup from the browser ignored; the
# agent speaking its dialect, reading the caller's number back and saving it
# with its tool. Keeps the replies (MP3) and what happened with the run.
#
# Uses the first Gemini key from STAGING's .env, read over SSH, masked in the
# log and never stored; about a minute of audio from the quota staging shares
# with live, inside the 10 minutes the owner approved for testing agents.

on:
  push:
    branches: [claude/beautiful-sagan-df90b3]
    paths:
      - .github/workflows/agent-live-agent-test.yml
      - scripts/agents/live_agent_test.mjs

permissions:
  contents: read

concurrency:
  group: agent-live-agent-test
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, intl, mbstring, pdo_sqlite, sqlite3, gd, zip
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build two agents' live setups (Saudi, Egyptian)
        run: |
          set -euo pipefail
          composer install --no-interaction --no-progress --prefer-dist > /dev/null
          cp .env.example .env
          php artisan key:generate --no-interaction > /dev/null
          mkdir -p setups
          php artisan agents:live-setup --dialect=ar-SA --voice=Achernar --name=Fatima > setups/sa.json
          php artisan agents:live-setup --dialect=ar-EG --voice=Callirrhoe --name=Sumaya > setups/eg.json
          python3 -c "import json; [json.load(open(f'setups/{n}.json')) for n in ('sa','eg')]; print('setups ok')"

      - name: Call the agents with a staging key
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          APP_PATH: ${{ secrets.STAGING_APP_PATH }}
        run: |
          set -euo pipefail
          SSH_HOST="$(printf '%s' "$SSH_HOST" | tr -d '[:space:]')"
          SSH_USER="$(printf '%s' "$SSH_USER" | tr -d '[:space:]')"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_test
          chmod 600 ~/.ssh/id_test
          ssh-keyscan -T 15 -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          remote="for d in ${APP_PATH:+'$APP_PATH'} ~/public_html ~; do [ -f \"\$d/artisan\" ] && cd \"\$d\" && break; done; grep -E '^GEMINI_TTS_API_KEY=' .env | head -1 | cut -d= -f2-"
          KEY="$(ssh -i ~/.ssh/id_test -o BatchMode=yes -o ConnectTimeout=20 "$SSH_USER@$SSH_HOST" "$remote" | tr -d "\"' \r\n")"
          rm -f ~/.ssh/id_test
          if [ -z "$KEY" ]; then echo "No GEMINI_TTS_API_KEY on staging"; exit 1; fi
          echo "::add-mask::$KEY"
          LIVE_KEY="$KEY" node scripts/agents/live_agent_test.mjs setups out

      - name: Make the replies easy to play (MP3)
        if: always()
        run: |
          set -uo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          for f in out/*.wav; do [ -f "$f" ] && ffmpeg -loglevel error -y -i "$f" -codec:a libmp3lame -q:a 3 "${f%.wav}.mp3"; done
          cat out/results.json 2>/dev/null | head -c 20000 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-live-agent-test
          path: |
            out/*.mp3
            out/results.json
          if-no-files-found: ignore
          retention-days: 14
