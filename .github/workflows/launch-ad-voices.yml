name: Launch ad voices

# Makes the launch ad's voices (marketing/launch-ad/lines.php) with Gemini key 1
# from STAGING's .env, the same way the homepage clips are made, then
# transcribes every clip with word timings (marketing/launch-ad/voices/words.json)
# and commits both back to this branch. Only missing clips are made: delete a
# WAV to remake it. Owner-approved (launch ad request, 2026-10-16). The key is
# read over SSH, masked in the log and never stored. Speech requests count
# against that key's quota, which staging shares with live.

on:
  push:
    branches: [claude/beautiful-sagan-df90b3]
    paths:
      - .github/workflows/launch-ad-voices.yml
      - marketing/launch-ad/lines.php
      - marketing/launch-ad/transcribe.py

permissions:
  contents: write

concurrency:
  group: launch-ad-voices
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, intl, mbstring, pdo_sqlite, sqlite3, gd, zip
          coverage: none

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null

      - name: Install dependencies
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: Generate with staging key 1
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          APP_PATH: ${{ secrets.STAGING_APP_PATH }}
        run: |
          set -euo pipefail
          mkdir -p public/audio/launch-ad marketing/launch-ad/voices
          cp marketing/launch-ad/voices/*.wav public/audio/launch-ad/ 2>/dev/null || true
          SSH_HOST="$(printf '%s' "$SSH_HOST" | tr -d '[:space:]')"
          SSH_USER="$(printf '%s' "$SSH_USER" | tr -d '[:space:]')"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_gen
          chmod 600 ~/.ssh/id_gen
          ssh-keyscan -T 15 -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          remote="for d in ${APP_PATH:+'$APP_PATH'} ~/public_html ~; do [ -f \"\$d/artisan\" ] && cd \"\$d\" && break; done; grep -E '^GEMINI_TTS_API_KEY(_1)?=' .env | head -n 1 | cut -d= -f2-"
          KEY="$(ssh -i ~/.ssh/id_gen -o BatchMode=yes -o ConnectTimeout=20 "$SSH_USER@$SSH_HOST" "$remote" | tr -d "\"' \r\n")"
          rm -f ~/.ssh/id_gen
          if [ -z "$KEY" ]; then echo "No GEMINI_TTS_API_KEY on staging"; exit 1; fi
          echo "::add-mask::$KEY"
          php artisan tts:showcase --set=ad --generate --pause=12 --key="$KEY" 2>&1 | grep -v '^\*' | cut -c1-200 || echo "Some clips failed (see above); the ones made are still committed."
          cp public/audio/launch-ad/*.wav marketing/launch-ad/voices/
          php -r '$o=[]; foreach ((require "marketing/launch-ad/lines.php")["samples"] as $s) { $o[$s["slug"]] = ["language" => $s["language"], "text" => trim(preg_replace("/\s*<[^<>]+>\s*/u", " ", $s["text"]))]; } file_put_contents("/tmp/lines.json", json_encode($o, JSON_UNESCAPED_UNICODE));'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Transcribe with word timings
        run: |
          pip install -q requests soundfile scipy faster-whisper==1.1.1
          python marketing/launch-ad/transcribe.py marketing/launch-ad/voices /tmp/lines.json marketing/launch-ad/voices/words.json

      - name: Commit the voices
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marketing/launch-ad/voices
          if git diff --cached --quiet; then echo "Nothing new"; exit 0; fi
          git diff --cached --stat
          git commit -m "Launch ad: voices made with staging key 1, with word timings"
          git pull --rebase origin "${GITHUB_REF#refs/heads/}"
          git push origin HEAD:${GITHUB_REF#refs/heads/}
