name: Long-form samples record

# Makes the voice samples page's long recordings (database/seeders/data/
# long_form_samples.php) on the site picked, the way a Studio Max member makes
# a voice, through the studio's own Generate request, and times each one from
# the request to the finished file (scripts/tts/long_form_record.php). It then
# commits to this branch, for the page:
#
#   public/audio/long-form/<slug>.mp3            the recording (96 kbps mono for the web)
#   database/seeders/data/long_form_takes.json   the time it took, its length, its pieces
#
# It uses the speech quota live and staging share: about 30 minutes of audio
# for all four texts. Run it by hand (on the branch to commit to), only when
# the owner has said yes, at a quiet hour: it reads with the site's own keys.

on:
  workflow_dispatch:
    inputs:
      target:
        description: The site to make them on (live has three keys, staging two)
        type: choice
        options: [live, staging]
        default: live
      slugs:
        description: "Only these texts, by slug (e.g. long-en-clockmaker); empty for all"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: long-form-samples-record
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null

      - name: Put the texts into the script
        env:
          SLUGS: ${{ inputs.slugs }}
        run: |
          set -euo pipefail
          php -r '
            $all = (require "database/seeders/data/long_form_samples.php")["samples"];
            $only = array_filter(preg_split("/[\s,]+/", (string) getenv("SLUGS")));
            $picked = array_values(array_filter($all, fn ($s) => $only === [] || in_array($s["slug"], $only, true)));
            if ($picked === []) { fwrite(STDERR, "No text has those slugs.\n"); exit(1); }
            foreach ($picked as $s) { printf("%s: %d characters\n", $s["slug"], mb_strlen($s["text"])); }
            $script = file_get_contents("scripts/tts/long_form_record.php");
            file_put_contents("record.php", str_replace("__SAMPLES__", base64_encode(json_encode($picked)), $script));
          '
          php -l record.php

      - name: Make them on ${{ inputs.target }}
        env:
          TARGET: ${{ inputs.target }}
          LIVE_HOST: ${{ secrets.LIVE_SSH_HOST }}
          LIVE_USER: ${{ secrets.LIVE_SSH_USER }}
          LIVE_KEY: ${{ secrets.LIVE_SSH_KEY }}
          LIVE_PATH: ${{ secrets.LIVE_APP_PATH }}
          STAGING_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_PATH: ${{ secrets.STAGING_APP_PATH }}
        run: |
          set -euo pipefail
          if [ "$TARGET" = live ]; then H="$LIVE_HOST"; U="$LIVE_USER"; K="$LIVE_KEY"; P="$LIVE_PATH"; else H="$STAGING_HOST"; U="$STAGING_USER"; K="$STAGING_KEY"; P="$STAGING_PATH"; fi
          H="$(printf '%s' "$H" | tr -d '[:space:]')"; U="$(printf '%s' "$U" | tr -d '[:space:]')"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$K" | tr -d '\r' > ~/.ssh/id_record
          chmod 600 ~/.ssh/id_record
          ssh-keyscan -T 15 -H "$H" >> ~/.ssh/known_hosts 2>/dev/null
          remote="for d in ${P:+'$P'} ~/public_html ~; do [ -f \"\$d/artisan\" ] && cd \"\$d\" && break; done; php"
          ssh -i ~/.ssh/id_record -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 "$U@$H" "$remote" < record.php > result.jsonl
          rm -f ~/.ssh/id_record
          echo "$(grep -c '^{' result.jsonl) text(s) back"

      - name: Keep the recordings and their times
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, subprocess, tempfile
          takes_file = 'database/seeders/data/long_form_takes.json'
          takes = json.load(open(takes_file, encoding='utf-8')) if os.path.exists(takes_file) else {}
          os.makedirs('public/audio/long-form', exist_ok=True)
          kept = 0
          for raw in open('result.jsonl', encoding='utf-8'):
              if not raw.startswith('{'):
                  continue
              line = json.loads(raw)
              audio = line.pop('audio_base64', None)
              print(json.dumps(line, ensure_ascii=False)[:600])
              if not audio or line.get('status') != 'done':
                  print(f"  {line['slug']}: not kept")
                  continue
              with tempfile.NamedTemporaryFile(suffix='.mp3', delete=False) as f:
                  f.write(base64.b64decode(audio))
                  original = f.name
              seconds = float(subprocess.check_output(['ffprobe', '-v', 'error', '-show_entries', 'format=duration', '-of', 'csv=p=0', original]).strip())
              out = f"public/audio/long-form/{line['slug']}.mp3"
              subprocess.run(['ffmpeg', '-v', 'error', '-y', '-i', original, '-ac', '1', '-codec:a', 'libmp3lame', '-b:a', '96k', out], check=True)
              os.unlink(original)
              takes[line['slug']] = {
                  'made_in_seconds': line['made_in_seconds'],
                  'audio_seconds': round(seconds, 2),
                  'characters': line['characters'],
                  'pieces': line.get('pieces'),
                  'pieces_at_once': line.get('pieces_at_once'),
                  'recorded_at': line['recorded_at'],
                  'site': os.environ['TARGET'],
                  'text_sha1': line['text_sha1'],
              }
              kept += 1
              print(f"  {line['slug']}: {seconds / 60:.1f} min of audio, made in {line['made_in_seconds']} s ({seconds / line['made_in_seconds']:.1f}x)")
          json.dump(dict(sorted(takes.items())), open(takes_file, 'w', encoding='utf-8'), indent=2, ensure_ascii=False)
          open(takes_file, 'a').write('\n')
          print(kept, 'kept')
          PY

      - name: Commit them
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/audio/long-form database/seeders/data/long_form_takes.json
          if git diff --cached --quiet; then echo "Nothing new to commit"; exit 1; fi
          git diff --cached --stat
          git commit -m "Voice samples page: long recordings made and timed on ${{ inputs.target }}"
          git pull --rebase origin "${GITHUB_REF#refs/heads/}"
          git push origin HEAD:${GITHUB_REF#refs/heads/}
