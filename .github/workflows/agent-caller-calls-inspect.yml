name: Agent caller calls inspect

# Read-only: everything one caller said to an agent, across all their calls on LIVE (or
# staging), starting from one call's cnv_... id. Pipes
# scripts/support/agent_caller_calls_inspect.php over SSH into the app's own PHP (READ ONLY
# database session). It prints what the caller said, so run it only when the owner asks to
# read a caller's calls, and delete the run's log once it has been read. Emails and phone
# numbers are masked. Nothing is written. A push of this file or the script runs it on live.

on:
  push:
    branches: [claude/beautiful-sagan-df90b3]
    paths:
      - .github/workflows/agent-caller-calls-inspect.yml
      - scripts/support/agent_caller_calls_inspect.php
  workflow_dispatch:
    inputs:
      target:
        description: live or staging
        required: true
        default: live
      call_id:
        description: the call's cnv_... id from the admin's address
        required: true

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect over SSH
        env:
          TARGET: ${{ inputs.target || 'live' }}
          CALL_ID: ${{ inputs.call_id || 'cnv_zoqwe4wbn5ngqwartt1wqyrs' }}
          LIVE_HOST: ${{ secrets.LIVE_SSH_HOST }}
          LIVE_USER: ${{ secrets.LIVE_SSH_USER }}
          LIVE_KEY: ${{ secrets.LIVE_SSH_KEY }}
          LIVE_PATH: ${{ secrets.LIVE_APP_PATH }}
          STAGING_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_PATH: ${{ secrets.STAGING_APP_PATH }}
        run: |
          set -euo pipefail
          case "$TARGET" in
            live) SSH_HOST="$LIVE_HOST"; SSH_USER="$LIVE_USER"; SSH_KEY="$LIVE_KEY"; APP_PATH="$LIVE_PATH" ;;
            staging) SSH_HOST="$STAGING_HOST"; SSH_USER="$STAGING_USER"; SSH_KEY="$STAGING_KEY"; APP_PATH="$STAGING_PATH" ;;
            *) echo "::error::target must be live or staging"; exit 1 ;;
          esac
          SSH_HOST="$(printf '%s' "$SSH_HOST" | tr -d '[:space:]')"
          SSH_USER="$(printf '%s' "$SSH_USER" | tr -d '[:space:]')"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_inspect
          chmod 600 ~/.ssh/id_inspect
          ssh-keyscan -T 15 -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          case "$CALL_ID" in cnv_*) ;; *) echo "::error::call_id must be a cnv_... id"; exit 1 ;; esac
          CALL_ID="$(printf '%s' "$CALL_ID" | tr -cd 'a-z0-9_')"
          remote="for d in ${APP_PATH:+'$APP_PATH'} ~/public_html ~; do [ -f \"\$d/artisan\" ] && cd \"\$d\" && break; done; CALL_ID='$CALL_ID' \$(command -v php8.4 || command -v php)"
          ssh -i ~/.ssh/id_inspect -o BatchMode=yes -o ConnectTimeout=20 "$SSH_USER@$SSH_HOST" "$remote" < scripts/support/agent_caller_calls_inspect.php

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/id_inspect
