name: Staging voice cloning check

# Read-only health check of voice cloning on STAGING.
# Pipes scripts/tts/voice_cloning_check.php over SSH into the staging app's PHP:
# server setup, the Gemini Voices API, cloned-voice rows (stuck, missing files,
# orphans on Gemini), and, unless turned off, each ready cloned voice speaking
# Arabic (Fusha, Saudi, Egyptian) and English (US, UK); Gemini transcribes every
# clip and the run fails if the words or the language do not match. The
# database session is READ ONLY; the audio files the synthesis writes are
# deleted again and come back here as an artifact.
# Same secrets as the SaaS stats workflow (STAGING_SSH_*).

on:
  workflow_dispatch:
    inputs:
      synthesize:
        description: Speak Arabic and English test lines with each ready cloned voice
        type: boolean
        default: true
  push:
    branches: [claude/elegant-ptolemy-nsecia]
    paths:
      - .github/workflows/staging-voice-cloning-check.yml
      - scripts/tts/voice_cloning_check.php

permissions:
  contents: read

concurrency:
  group: staging-voice-cloning-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Run on staging over SSH
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          APP_PATH: ${{ secrets.STAGING_APP_PATH }}
          CLONE_SYNTH: ${{ (github.event_name != 'workflow_dispatch' || inputs.synthesize) && '1' || '0' }}
        run: |
          set -euo pipefail
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$SSH_KEY" ]; then
            echo "::error::Staging SSH secrets are not set."
            exit 1
          fi
          SSH_HOST="$(printf '%s' "$SSH_HOST" | tr -d '[:space:]')"
          SSH_USER="$(printf '%s' "$SSH_USER" | tr -d '[:space:]')"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_check
          chmod 600 ~/.ssh/id_check
          ssh-keyscan -T 15 -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          remote="for d in ${APP_PATH:+'$APP_PATH'} ~/public_html ~; do [ -f \"\$d/artisan\" ] && cd \"\$d\" && break; done; CLONE_SYNTH=$CLONE_SYNTH php"
          ssh -i ~/.ssh/id_check -o BatchMode=yes -o ConnectTimeout=20 "$SSH_USER@$SSH_HOST" "$remote" \
            < scripts/tts/voice_cloning_check.php > result.json
          rm -f ~/.ssh/id_check

      - name: Install ffprobe
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg > /dev/null

      - name: Summarise and save the audio
        run: |
          set -euo pipefail
          mkdir -p audio
          python3 - <<'EOF'
          import base64, difflib, json, re, subprocess, sys
          data = json.load(open('result.json'))

          def norm(text):
              text = (text or '').lower()
              text = re.sub('[\u064B-\u065F\u0670\u0640]', '', text)
              text = re.sub('[\u0623\u0625\u0622]', '\u0627', text).replace('\u0649', '\u064A').replace('\u0629', '\u0647')
              text = re.sub(r'[^\w\s]', ' ', text)
              return ' '.join(text.split())

          problems = []
          rows = []
          for case in data.get('synthesis', []):
              audio = case.pop('audio_base64', None)
              if audio:
                  path = f"audio/voice{case['voice_row']}_{case['name']}.{case.get('format', 'bin')}"
                  open(path, 'wb').write(base64.b64decode(audio))
                  probe = subprocess.run(['ffprobe', '-v', 'error', '-show_entries', 'format=duration', '-of', 'csv=p=0', path], capture_output=True, text=True)
                  case['audio_seconds'] = round(float(probe.stdout.strip() or 0), 1) if probe.returncode == 0 else None
              heard = case.get('heard') or {}
              score = difflib.SequenceMatcher(None, norm(case.get('spoken_text')), norm(heard.get('transcript'))).ratio() if heard.get('transcript') else 0.0
              want = 'arabic' if case['name'].startswith('ar_') else 'english'
              lang_ok = want in str(heard.get('language', '')).lower()
              case['match'] = round(score, 3)
              case['language_ok'] = lang_ok
              good = case.get('ok') and score >= 0.85 and lang_ok
              if not good:
                  problems.append(f"voice {case['voice_row']} {case['name']}: ok={case.get('ok')} match={score:.2f} heard_language={heard.get('language')} {case.get('error', '')} {heard.get('error', '')}".strip())
              rows.append(f"{'PASS' if good else 'FAIL'}  voice {case['voice_row']} ({case['voice_language']})  {case['name']:<14} {str(case.get('audio_seconds')):>5}s  match {score:.2f}  heard: {heard.get('language')} / {heard.get('accent_or_dialect')}")

          print(json.dumps(data, ensure_ascii=False, indent=2))
          json.dump(data, open('summary.json', 'w'), ensure_ascii=False, indent=2)
          print('\n'.join(['', 'Cloned voice synthesis, transcribed back:'] + rows))
          if not data['voices_api']['ok']:
              problems.append('Voices API unreachable')
          if data['db']['stuck_over_20_min']:
              problems.append(f"{len(data['db']['stuck_over_20_min'])} stuck rows")
          if data.get('synthesis_skipped'):
              print('Synthesis skipped:', data['synthesis_skipped'])
          print('\nRESULT:', 'PASS' if not problems else 'FAIL')
          for p in problems:
              print('  -', p)
          sys.exit(1 if problems else 0)
          EOF

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-voice-cloning-check-${{ github.run_number }}
          path: |
            audio/
            summary.json
          if-no-files-found: ignore
          retention-days: 14
