name: Speaker avatars make

# Makes the speaker avatars listed in resources/avatars/remake.txt (one per line, as
# language:Name:gender, e.g. ar:Maha:female) again, in the Listen avatar style
# (php artisan speakers:avatars), with the first Gemini key from STAGING's .env, and
# commits them back to the branch. The key is read over SSH, masked in the log and
# never stored. It runs when that list changes on a branch, or by hand. Pictures only:
# no speech is generated.

on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths: ['resources/avatars/remake.txt']

permissions:
  contents: write

concurrency:
  group: speaker-avatars-make-${{ github.ref }}
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, intl, mbstring, pdo_sqlite, sqlite3, gd, zip
          coverage: none

      - name: Install dependencies
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: Make the avatars with the staging key
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          APP_PATH: ${{ secrets.STAGING_APP_PATH }}
        run: |
          set -euo pipefail
          SSH_HOST="$(printf '%s' "$SSH_HOST" | tr -d '[:space:]')"
          SSH_USER="$(printf '%s' "$SSH_USER" | tr -d '[:space:]')"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_gen
          chmod 600 ~/.ssh/id_gen
          ssh-keyscan -T 15 -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          remote="for d in ${APP_PATH:+'$APP_PATH'} ~/public_html ~; do [ -f \"\$d/artisan\" ] && cd \"\$d\" && break; done; grep -E '^GEMINI_TTS_API_KEY=' .env | head -1 | cut -d= -f2-"
          KEY="$(ssh -i ~/.ssh/id_gen -o BatchMode=yes -o ConnectTimeout=20 "$SSH_USER@$SSH_HOST" "$remote" | tr -d "\"' \r\n")"
          rm -f ~/.ssh/id_gen
          if [ -z "$KEY" ]; then echo "No GEMINI_TTS_API_KEY on staging"; exit 1; fi
          echo "::add-mask::$KEY"
          args=()
          while IFS= read -r line; do
            line="$(printf '%s' "$line" | tr -cd 'A-Za-z0-9:-')"
            [ -n "$line" ] && args+=("--speaker=$line")
          done < <(grep -v '^#' resources/avatars/remake.txt)
          if [ "${#args[@]}" -eq 0 ]; then echo "No speakers listed"; exit 1; fi
          php artisan speakers:avatars --force --pause=3 --key="$KEY" "${args[@]}"

      - name: Commit the avatars
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/speakers/*.webp
          if git diff --cached --quiet; then echo "No new avatars"; exit 1; fi
          git diff --cached --stat
          git commit -m "Speaker avatars: made again, each with a look of their own" -m "$(grep -v '^#' resources/avatars/remake.txt | tr '\n' ' ')"
          git pull --rebase origin "${GITHUB_REF#refs/heads/}"
          git push origin HEAD:${GITHUB_REF#refs/heads/}
