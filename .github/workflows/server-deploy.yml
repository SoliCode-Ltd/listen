name: Server deploy

# The servers are plain uploads, not git checkouts. This copies the files
# tracked on main onto the server (staging: on the branch the run was started
# from, so a branch can be tried there before it is merged; live: always main). It never deletes, and never touches .env,
# storage/, vendor/, node_modules/, uploads, or the per-server extension
# config (public/extensions/*/config.js).
#   inspect: lists the files that differ from what would be deployed (nothing changes).
#   deploy:  copies main over the app, then clears and rebuilds caches (never
#            the app cache; routes only with route:trans:cache). Any failing
#            step fails the run, and so does /en or /ar not answering 200.
#   ffmpeg:  puts a static ffmpeg in storage/app/bin (for the sound
#            environments and download formats) when the host has none.
#   migrate: lists the pending migrations, then runs them (php artisan
#            migrate --force). Only when the owner asks; deploy first.
#   composer: installs the packages composer.lock lists (composer install;
#            without the development tools unless the server already has them),
#            makes the "Sign in with Listen" keys once (passport:keys, never
#            replaced; readable like .env), then rebuilds the caches as deploy
#            does. Only when the owner asks, after a deploy whose inspect said
#            composer.lock changed.
#   indexnow: tells Bing, Yandex, Naver and Seznam about every public page
#            (php artisan seo:indexnow). Run on live after a deploy that adds pages.
#   queue:   shows how the queue workers run, then makes sure a job is never
#            handed to a second worker while the first is still on it: sets
#            DB_QUEUE_RETRY_AFTER=180 in .env (above the 150 s job limit; the
#            old .env is kept in storage/app/listen-deploy), rebuilds the config
#            cache and restarts the workers.
#   billing-trace: read-only. For one Stripe customer (input "customer"),
#            prints the plans' Stripe prices, the member's local billing rows
#            and their log lines, plus every local subscription whose price
#            no plan knows any more. Writes nothing; prints no names or emails.
#   plan-audit: read-only. Every member on a paid plan with no card
#            subscription: how the plan is saved, whether anything was paid
#            for it, and whether it needs a look. Writes nothing; prints
#            member ids only.
#   settings: the server's own switches in .env (the old .env is kept in
#            storage/app/listen-deploy): LISTEN_LIVE_ACTIONS true on live and
#            false on staging, the extension's old shared LISTEN_API_KEY
#            removed, .env readable by its owner and the web server only (640),
#            standard voices asked for uncompressed audio (an MP3
#            SPEECH_TTS_AUDIO_ENCODING becomes LINEAR16; they are compressed
#            once on the server), and on live a local/testing APP_ENV set to production and
#            APP_DEBUG turned off. Rebuilds the config cache, restarts the
#            workers, then shows what is in use (never a secret's value), the
#            PHP limits, the queue workers and the scheduler.
#   php-limits: read-only. The PHP-FPM pools and the limits set in the pool
#            files this user can read, any .user.ini, and what the web
#            server's PHP really uses (memory, time, upload sizes, opcache),
#            read from a one-off page under a random name that is deleted
#            straight after. Also who the web server runs as, who can read
#            .env, the cron lines that start Laravel, and how long work after
#            the reply may run (each run reads the last run's test and starts
#            a new one: a page that answers at once, then waits up to 15 min).
#   data-checks: read-only (READ ONLY database session). Paid plans marked
#            past due, members blocked by the wording rule (paying ones
#            first), the share of sign-ups per network address (counts only,
#            never an address), the speech and credit settings, how the long
#            texts of the last 90 days fared, and PHP's memory and time errors
#            in the app's logs (counts, times and code lines, never a text).
#            Prints member ids only.
#   wording-blocks: read-only. Re-checks the accounts the wording rule blocked
#            by itself against today's word list and rule (member ids and words
#            only, never a text). wording-blocks-apply unblocks the accounts
#            today's rule would not have blocked; admin blocks are left alone.
#   promises: read-only (READ ONLY database session). What the site promises
#            members, from this server's own data: every plan's limits and
#            switches and the lines its pricing card shows in English and
#            Arabic, the named site settings members read (never a key or a
#            password) and the config those promises depend on; then the text
#            of the public pages that show them. No member data.
#   demo-links: read-only (READ ONLY database session). For one member (input
#            "member": an email or a member id): how they signed up, their demo
#            use, and every account sharing a browser, a demo fingerprint or an
#            address with them, and whether the demo's linking rules count it.
#            Addresses, cookies and fingerprints only as short hashes.
#   join-check: read-only (READ ONLY database session). Whether the newest
#            long premium voices, read in pieces and joined, keep one voice:
#            each piece's pace, pitch and level against the voice's others
#            and against the halves of one piece (scripts/support/join_check.php).
#            Numbers and voice ids only, never a text.
#   speech-rates: read-only (READ ONLY database session). How long the voices
#            really take to say a text, from the finished voices whose audio
#            was measured: how far the studio's estimate is from the real
#            length, the speaking rates by language and engine, and a fit of
#            the seconds against what the texts hold. Totals only, never a
#            text or a member (scripts/support/speech_rates.php).
#   plan-lines: read-only (READ ONLY database session). Which plans' own card
#            lines still say "Priority Queue" / "Processing priority" /
#            "أولوية المعالجة", with each plan's lines before as JSON.
#            plan-lines-apply takes those lines out (and only those), printing
#            the same backup (scripts/support/plan_lines.php).
#   owner-todo: read-only (READ ONLY database session). Whether the things
#            only the owner changes in the admin are still to do: plan card
#            lines that promise a queue or priority, saved plan descriptions,
#            SEO texts saved over the pages' own, referral campaigns switched
#            on (scripts/support/owner_todo.php). No member data.
#   speed-check: read-only (READ ONLY database session). How long premium
#            voices really take to make, by how many pieces they are read in,
#            and so how long a text at each plan's longest allowed length
#            would take; the longest voices made, the long ones that failed,
#            and how often a piece was sent again. Totals and voice ids only
#            (scripts/support/speed_check.php).
#   email-check: read-only (READ ONLY database session). Whether the site's
#            email goes out (the mailer in use, never a password), the sign-ups
#            since confirmation links began and how many confirmed, log lines
#            about links that failed to send (addresses masked), and for one
#            member (input "member": an email or a member id) how they signed
#            up and whether free use waits for them. Prints member ids only.
#   page-check: staging only. Shows the pages members use inside the app,
#            in English and Arabic, as a free and a paying test member, and
#            fails on an error, a wrong status or text shown as its key
#            (scripts/support/staging_page_check.php). Billing pages are left
#            out: staging runs the live Stripe keys.
#   dub-test: staging only. Dubs the test video with the branch's code the way
#            a member's dub is made, with the settings of the newest dub of a
#            video that long (input "dub" changes them: "voice=Kore
#            dialect=ar-EG"), for no member, and keeps the dubbed video and its
#            report with the run (scripts/support/dub_test.php). The test video
#            is sent from tests/dub-test/source.mp4 when the branch has it, and
#            stays on staging for the next runs; dub "clean" removes it. It uses
#            the speech quota staging shares with live (about 25 requests a
#            run): only when the owner has said yes.
#   voice-design-test: staging only. One real Voice Design with the branch's
#            code, the way the dashboard makes one, for the admin email's account
#            (input "design": the example character, cairo_grandma by default),
#            with what each request took and what that costs; take 1 stays in the
#            admin's library as "Staging test voice", and the takes' audio is kept
#            with the run (scripts/support/voice_design_test.php). It uses the
#            speech quota staging shares with live (7 requests for 3 takes): only
#            when the owner has said yes. Needs mode migrate first.
#   voice-cloning-examples: staging only. The voice cloning stage's two examples,
#            one Arabic and one English, each saying it is a cloned voice, spoken
#            by the admin email's own ready cloned voice (nothing is made without
#            one), kept with the run to commit to public/audio/voice-cloning/
#            examples/ (scripts/support/voice_cloning_examples.php). Two short
#            speech requests on the quota staging shares with live: only when the
#            owner has said yes.
#   voice-design-log: read-only. The last 30 "Voice design:" lines of the app's
#            logs (what the speech service said when a design or a delete failed:
#            the key's name, the reason and the service's own words; never a
#            description or a member).
# New migrations and composer.lock changes are reported, not run (see migrate and composer).
# The "Run over SSH" script must stay under GitHub's 21,000-character limit for one
# step (tests/Feature/ServerDeployWorkflowTest.php): longer remote work goes in
# scripts/support/ and is sent with tool().

on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [staging, live]
        default: staging
      mode:
        type: choice
        options: [inspect, deploy, ffmpeg, indexnow, migrate, composer, queue, settings, php-limits, data-checks, email-check, demo-links, promises, speech-rates, speed-check, owner-todo, plan-lines, plan-lines-apply, join-check, wording-blocks, wording-blocks-apply, page-check, billing-trace, plan-audit, dub-test, voice-design-test, voice-design-log, voice-cloning-examples]
        default: inspect
      customer:
        description: "billing-trace only: the Stripe customer id (cus_...)"
        type: string
        default: ""
      member:
        description: "email-check, demo-links, join-check and speed-check: a member's email or member id"
        type: string
        default: ""
      dub:
        description: "dub-test only: settings to change (voice=Kore dialect=ar-EG style= emotion= background=keep), or clean"
        type: string
        default: ""
      design:
        description: "voice-design-test only: the example character to design (cairo_grandma, evil_ogre, gulf_commentator ...)"
        type: string
        default: ""

permissions:
  contents: read

# One run at a time per server: a second deploy (or migrate) waits for the first.
concurrency:
  group: server-deploy-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # A test dub takes the server several minutes (separation, hearing, a voice for each line).
    timeout-minutes: ${{ inputs.mode == 'dub-test' && 45 || 15 }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Live always gets main. Staging gets the branch this run was started from
          # (main when started from main), to try work there before it is merged.
          ref: ${{ inputs.target == 'live' && 'main' || github.ref_name }}
          fetch-depth: 1
      - name: Build the bundle and its checksums
        run: |
          set -euo pipefail
          git ls-files | grep -v -E '^(\.github/|tests/|marketing/|\.env|storage/|vendor/|node_modules/|public/storage)' \
            | grep -v -E '(^|/)\.git(ignore|attributes)$|^public/extensions/[^/]+/config\.js$' > files.txt
          tar -czf bundle.tgz -T files.txt
          xargs -d '\n' md5sum < files.txt > manifest.md5
          echo "${{ inputs.target == 'live' && 'main' || github.ref_name }}: $(git log -1 --format='%h %s')"; wc -l < files.txt
      - name: Run over SSH
        env:
          TARGET: ${{ inputs.target }}
          MODE: ${{ inputs.mode }}
          CUSTOMER: ${{ inputs.customer }}
          MEMBER: ${{ inputs.member }}
          DUB: ${{ inputs.dub }}
          DESIGN: ${{ inputs.design }}
          # What is deployed, as a variable: the script below must hold no ${{ }}
          # of its own, or GitHub reads all of it as one expression (21,000 at most).
          DEPLOY_REF: ${{ inputs.target == 'live' && 'main' || github.ref_name }}
          LIVE_HOST: ${{ secrets.LIVE_SSH_HOST }}
          LIVE_USER: ${{ secrets.LIVE_SSH_USER }}
          LIVE_KEY: ${{ secrets.LIVE_SSH_KEY }}
          LIVE_PATH: ${{ secrets.LIVE_APP_PATH }}
          STAGING_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_PATH: ${{ secrets.STAGING_APP_PATH }}
        run: |
          set -euo pipefail
          if [ "$TARGET" = live ]; then H="$LIVE_HOST"; U="$LIVE_USER"; K="$LIVE_KEY"; P="$LIVE_PATH"; else H="$STAGING_HOST"; U="$STAGING_USER"; K="$STAGING_KEY"; P="$STAGING_PATH"; fi
          H="$(printf '%s' "$H" | tr -d '[:space:]')"; U="$(printf '%s' "$U" | tr -d '[:space:]')"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$K" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -T 15 -H "$H" >> ~/.ssh/known_hosts 2>/dev/null
          S="ssh -i $HOME/.ssh/id_deploy -o BatchMode=yes -o ConnectTimeout=20 $U@$H"
          FIND="for d in ${P:+'$P'} ~/public_html ~; do [ -f \"\$d/artisan\" ] && cd \"\$d\" && break; done"
          # A support script as it is in the commit this run was started from (live checks out main, which may not have it yet).
          tool() { git fetch -q --depth=1 origin "$GITHUB_SHA" && git show "$GITHUB_SHA:scripts/support/$1"; }
          $S "$FIND; mkdir -p storage/app/listen-deploy"
          $S "$FIND; cat > storage/app/listen-deploy/manifest.md5" < manifest.md5
          echo "== Files that differ from $DEPLOY_REF (or are missing) =="
          $S "$FIND; md5sum -c --quiet storage/app/listen-deploy/manifest.md5 2>/dev/null | sed 's/: FAILED open or read/  (missing)/; s/: FAILED$/  (changed)/' | grep -v '^md5sum' | sort" | tee diff.txt || true
          echo "== $(wc -l < diff.txt) file(s) =="
          # Where each of those came from: when it last changed on the server, and whether it is main's copy.
          if [ -s diff.txt ]; then
            main_sha="$(git fetch -q --depth=1 origin main 2>/dev/null && git rev-parse FETCH_HEAD || true)"
            sed 's/  ([a-z]*)$//' diff.txt > names.txt
            $S "$FIND; while read -r f; do [ -f \"\$f\" ] && echo \"\$(md5sum < \"\$f\" | cut -c1-32) \$(date -u -r \"\$f\" '+%Y-%m-%d %H:%M') \$f\"; done; true" < names.txt > server.txt || true
            while read -r sum day time file; do
              main_sum="$( { [ -n "$main_sha" ] && git show "$main_sha:$file" 2>/dev/null || true; } | md5sum | cut -c1-32)"
              echo "  $file: last changed $day $time UTC$( [ "$sum" = "$main_sum" ] && echo ', same as main' || true)"
            done < server.txt
          fi
          echo "New or changed migrations:"; grep '^database/migrations/' diff.txt || echo "  none"
          echo "composer.lock:"; grep -q '^composer.lock' diff.txt && echo "  CHANGED: after the deploy, run this workflow with mode composer" || echo "  same"
          echo "ffmpeg (sound environments, download formats):"
          $S "$FIND; bash -s" <<'REMOTE' || true
          f="$(command -v ffmpeg || true)"; [ -x storage/app/bin/ffmpeg ] && f="$f storage/app/bin/ffmpeg"
          e="$(grep -E '^FFMPEG_PATH=' .env 2>/dev/null || true)"
          echo "  found: ${f:-NONE (run this workflow with mode ffmpeg)} ${e}"
          php -r 'echo "  PHP proc_open (command line): ", function_exists("proc_open") && stripos((string) ini_get("disable_functions"), "proc_open") === false ? "allowed" : "DISABLED", PHP_EOL;'
          REMOTE
          if [ "$MODE" = migrate ]; then
            $S "$FIND; php artisan migrate:status --pending 2>/dev/null || php artisan migrate:status | grep -i pending || true"
            $S "$FIND; php artisan migrate --force"
            rm -f ~/.ssh/id_deploy
            exit 0
          fi
          if [ "$MODE" = composer ]; then
            # The packages, the sign-in keys once, then fresh caches (scripts/support/composer_install.sh).
            tool composer_install.sh | $S "$FIND; bash -s"
            rm -f ~/.ssh/id_deploy
            exit 0
          fi
          if [ "$MODE" = billing-trace ]; then
            printf '%s' "$CUSTOMER" | grep -qE '^cus_[A-Za-z0-9]+$' || { echo "customer must look like cus_..."; exit 1; }
            $S "$FIND; CUSTOMER='$CUSTOMER' php" <<'REMOTE'
          <?php
          require 'vendor/autoload.php';
          $app = require 'bootstrap/app.php';
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $db = fn (string $t) => Illuminate\Support\Facades\DB::table($t);
          $show = function (string $title, $rows) { echo "== $title ==\n"; foreach ($rows as $r) echo '  ', json_encode($r, JSON_UNESCAPED_SLASHES), "\n"; if (count($rows) === 0) echo "  none\n"; };
          echo 'App timezone: ', config('app.timezone'), "\n";
          $plans = $db('plans')->select('id', 'slug', 'price_cents', 'is_active', 'stripe_price_monthly', 'stripe_price_yearly', 'updated_at')->orderBy('id')->get();
          $show('Plans and their Stripe prices', $plans);
          $known = $plans->flatMap(fn ($p) => [$p->stripe_price_monthly, $p->stripe_price_yearly])->filter()->values()->all();
          $users = $db('users')->where('stripe_id', getenv('CUSTOMER'))->select('id', 'created_at', 'stripe_id', 'pm_type', 'pm_last_four', 'subscription_status_checked_at')->get();
          $show('Members with this Stripe customer', $users);
          foreach ($users as $u) {
              $show("billing_subscriptions of member {$u->id}", $db('billing_subscriptions')->where('user_id', $u->id)->orderBy('id')->get());
              $show("plan subscriptions of member {$u->id}", $db('subscriptions')->where('user_id', $u->id)->orderBy('id')->get());
          }
          $show('Local Stripe subscriptions on a price no plan knows (all members)', $db('billing_subscriptions')->whereNotNull('stripe_price')->whereNotIn('stripe_price', $known)->select('id', 'user_id', 'stripe_id', 'stripe_status', 'stripe_price', 'created_at', 'updated_at', 'ends_at')->orderBy('id')->get());
          REMOTE
            for u in $($S "$FIND; CUSTOMER='$CUSTOMER' php -r 'require \"vendor/autoload.php\"; \$a = require \"bootstrap/app.php\"; \$a->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap(); echo Illuminate\Support\Facades\DB::table(\"users\")->where(\"stripe_id\", getenv(\"CUSTOMER\"))->pluck(\"id\")->implode(\" \");'"); do
              echo "== Log lines for member $u (Oct 15-17) =="
              $S "$FIND; grep -hE '^\[2026-10-1[5-7]' storage/logs/*.log 2>/dev/null | grep -E \"\\\"user_id\\\":$u[,}]\" | cut -c1-400 | tail -60" || echo "  none"
            done
            rm -f ~/.ssh/id_deploy
            exit 0
          fi
          if [ "$MODE" = plan-audit ]; then
            $S "$FIND; php" <<'REMOTE'
          <?php
          require 'vendor/autoload.php';
          $app = require 'bootstrap/app.php';
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $db = fn (string $t) => Illuminate\Support\Facades\DB::table($t);
          $now = now()->toDateTimeString();
          echo "Now (UTC): $now\n";
          $paidPlans = $db('plans')->where('price_cents', '>', 0)->where(fn ($q) => $q->where('kind', 'subscription')->orWhereNull('kind'))->pluck('slug', 'id');
          // A member's plan is their newest plan row.
          $latest = $db('subscriptions')->selectRaw('max(id) as id')->groupBy('user_id')->pluck('id');
          $rows = $db('subscriptions')->whereIn('id', $latest)->where('status', 'active')->whereIn('plan_id', $paidPlans->keys())->orderBy('user_id')->get();
          $totals = [];
          echo "== Members on a paid plan with no card subscription ==\n";
          foreach ($rows as $r) {
              $card = $db('billing_subscriptions')->where('user_id', $r->user_id)->whereNotIn('stripe_status', ['canceled', 'incomplete_expired'])->exists();
              if ($card) { $totals['on a card subscription (not listed)'] = ($totals['on a card subscription (not listed)'] ?? 0) + 1; continue; }
              $stripeCustomer = trim((string) $db('users')->where('id', $r->user_id)->value('stripe_id')) !== '';
              $approved = $db('manual_payment_requests')->where('user_id', $r->user_id)->where('plan_id', $r->plan_id)->where('status', 'approved')->orderByDesc('id')->get(['reviewed_at', 'billing_cycle']);
              $otherOverride = $db('subscriptions')->where('user_id', $r->user_id)->where('id', '!=', $r->id)->where('status', 'active')->where('billing_payment_state', 'manual_override')->exists();
              $state = (string) $r->billing_payment_state;
              $ended = $r->current_period_end !== null && $r->current_period_end < $now;
              $source = $approved->isNotEmpty() ? 'paid by InstaPay / Vodafone Cash' : 'given by the team';
              $verdict = match (true) {
                  $state === 'manual_override' => 'OK, kept as set',
                  $ended => 'ended',
                  $stripeCustomer && $otherOverride => 'CHECK: saved as '.$state.', kept only because an older row is Manual Override',
                  $stripeCustomer => 'CHECK: saved as '.$state.', has a Stripe customer',
                  default => 'CHECK: saved as '.$state.', end date was pushed a month from each visit until today',
              };
              $totals[$source.' / '.$verdict] = ($totals[$source.' / '.$verdict] ?? 0) + 1;
              echo '  ', json_encode([
                  'member' => $r->user_id, 'plan' => $paidPlans[$r->plan_id], 'saved_as' => $state,
                  'period_start' => $r->current_period_start, 'period_end' => $r->current_period_end,
                  'row_created' => $r->created_at, 'row_updated' => $r->updated_at, 'stripe_customer' => $stripeCustomer,
                  'approved_payments_for_plan' => $approved->count(), 'last_approved' => $approved->first()->reviewed_at ?? null,
                  'source' => $source, 'verdict' => $verdict,
              ], JSON_UNESCAPED_SLASHES), "\n";
          }
          echo "== Totals ==\n";
          foreach ($totals as $k => $n) echo "  $k: $n\n";
          if ($totals === []) echo "  none\n";
          REMOTE
            rm -f ~/.ssh/id_deploy
            exit 0
          fi
          if [ "$MODE" = queue ]; then
            $S "$FIND; bash -s" <<'REMOTE'
          set -e
          echo "== Queue workers running now =="
          ps -eo pid,etime,args | grep -E 'artisan (queue:(work|listen)|horizon)' | grep -v grep || echo "  none right now"
          echo "== Cron lines that start Laravel =="
          crontab -l 2>/dev/null | grep -E 'artisan|queue' || echo "  none in this user's crontab"
          echo "== Queue settings in .env (before) =="
          grep -E '^(QUEUE_CONNECTION|DB_QUEUE[A-Z_]*|REDIS_QUEUE[A-Z_]*)=' .env || echo "  none (defaults)"
          b="storage/app/listen-deploy/env.backup-$(date -u +%Y%m%d%H%M%S)"
          cp .env "$b" && chmod 600 "$b" && echo "  old .env kept as $b"
          if grep -q '^DB_QUEUE_RETRY_AFTER=' .env; then sed -i 's/^DB_QUEUE_RETRY_AFTER=.*/DB_QUEUE_RETRY_AFTER=180/' .env; else printf '\nDB_QUEUE_RETRY_AFTER=180\n' >> .env; fi
          echo "== After =="
          grep -E '^DB_QUEUE_RETRY_AFTER=' .env
          [ -f bootstrap/cache/config.php ] && php artisan config:cache | tail -1
          php artisan queue:restart | tail -1
          echo "== In use =="
          php artisan config:show queue.connections.database 2>/dev/null | grep -iE 'retry_after' || echo "  (could not read the config)"
          REMOTE
            rm -f ~/.ssh/id_deploy
            exit 0
          fi
          if [ "$MODE" = settings ]; then
            $S "$FIND; TARGET='$TARGET' bash -s" <<'REMOTE'
          set -euo pipefail
          b="storage/app/listen-deploy/env.backup-$(date -u +%Y%m%d%H%M%S)"
          cp .env "$b" && chmod 600 "$b" && echo "Old .env kept as $b"
          # KEY=value once: the line is replaced, or added at the end.
          set_env() { if grep -q "^$1=" .env; then sed -i "s|^$1=.*|$1=$2|" .env; else printf '\n%s=%s\n' "$1" "$2" >> .env; fi; }
          # The value of KEY in .env, without quotes or spaces.
          env_of() { grep -E "^$1=" .env | tail -1 | cut -d= -f2- | tr -d "\"' " || true; }
          if [ "$TARGET" = live ]; then set_env LISTEN_LIVE_ACTIONS true; else set_env LISTEN_LIVE_ACTIONS false; fi
          echo "LISTEN_LIVE_ACTIONS: $(env_of LISTEN_LIVE_ACTIONS)"
          # The extension's old shared key acted as account 1; members' extensions use their own keys.
          if grep -q '^LISTEN_API_KEY=' .env; then sed -i '/^LISTEN_API_KEY=/d' .env; echo "LISTEN_API_KEY: removed"; else echo "LISTEN_API_KEY: was not set"; fi
          # Standard voices: the engine's uncompressed audio, compressed once here (without ffmpeg the site asks for MP3 itself).
          a="$(env_of SPEECH_TTS_AUDIO_ENCODING)"; a="${a:-$(env_of GOOGLE_TTS_AUDIO_ENCODING)}"
          case "$a" in mp3|MP3) set_env SPEECH_TTS_AUDIO_ENCODING LINEAR16; echo "SPEECH_TTS_AUDIO_ENCODING: $a -> LINEAR16";; *) echo "SPEECH_TTS_AUDIO_ENCODING: ${a:-not set} (kept)";; esac
          # Its owner and the web server's group only: it was readable by every account on the server.
          chmod 640 .env 2>/dev/null && echo ".env: owner and web server only (640)" || echo ".env: who can read it was left as it was"
          if [ "$TARGET" = live ]; then
            # local or testing believes payment events nobody signed; debug pages show internals.
            e="$(env_of APP_ENV)"; case "$e" in local|testing) set_env APP_ENV production; echo "APP_ENV: $e -> production";; *) echo "APP_ENV: ${e:-not set} (kept)";; esac
            d="$(env_of APP_DEBUG)"; case "$d" in true|TRUE|True|1) set_env APP_DEBUG false; echo "APP_DEBUG: $d -> false";; *) echo "APP_DEBUG: ${d:-not set} (kept)";; esac
          fi
          if [ -f bootstrap/cache/config.php ]; then php artisan config:cache | tail -1; fi
          php artisan queue:restart | tail -1 || true
          echo "== Queue workers running now =="
          ps -eo pid,etime,args | grep -E 'artisan (queue:(work|listen)|horizon)' | grep -v grep || echo "  none right now"
          echo "== Cron lines that start Laravel =="
          crontab -l 2>/dev/null | grep -E 'artisan' || echo "  none in this user's crontab"
          echo "== PHP-FPM time limits (when this user can read the pool file) =="
          found=0
          for f in /etc/php/*/fpm/pool.d/*.conf /etc/php-fpm.d/*.conf /etc/php*/php-fpm.d/*.conf; do
            [ -r "$f" ] || continue
            grep -HE '^[[:space:]]*(request_terminate_timeout|php_admin_value\[max_execution_time\]|php_value\[max_execution_time\])' "$f" && found=1 || true
          done
          [ "$found" = 1 ] || echo "  not readable from here: set request_terminate_timeout in the Cloudways panel"
          REMOTE
            $S "$FIND; php" <<'REMOTE'
          <?php
          require 'vendor/autoload.php';
          $app = require 'bootstrap/app.php';
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $line = function (string $label, $value): void { echo '  '.str_pad($label, 46).(is_bool($value) ? ($value ? 'yes' : 'no') : (string) $value)."\n"; };
          echo "== In use now ==\n";
          $line('APP_ENV / debug', config('app.env').' / '.(config('app.debug') ? 'ON' : 'off'));
          $line('Acts on real customers (live-site switch)', App\Support\LiveServer::allowsCustomerActions());
          $line('Stripe webhook signing secret', trim((string) config('services.stripe.webhook_secret')) !== '' ? 'set' : 'MISSING');
          $line('Throwaway inboxes refused at sign-up', (bool) config('disposable_email.enabled', true));
          $line('Free use waits for a confirmed email', (bool) config('listen.demo.require_verified_email', true));
          $line('Standard voices asked for', strtoupper((string) config('services.google_tts.audio_encoding')));
          $line('Queue / retry_after (seconds)', config('queue.default').' / '.config('queue.connections.database.retry_after'));
          $line('Texts made after the reply from (characters)', (string) config('listen.audio.force_async_chars'));
          $line('PHP (command line) max_execution_time', (string) ini_get('max_execution_time'));
          $line('PHP (command line) memory_limit', (string) ini_get('memory_limit'));
          REMOTE
            rm -f ~/.ssh/id_deploy
            exit 0
          fi
          if [ "$MODE" = php-limits ]; then
            tool php_limits.sh | $S "$FIND; bash -s"
            rm -f ~/.ssh/id_deploy
            exit 0
          fi
          if [ "$MODE" = wording-blocks ] || [ "$MODE" = wording-blocks-apply ]; then
            $S "$FIND; php artisan listen:recheck-wording-blocks $([ "$MODE" = wording-blocks-apply ] && echo --apply)"
            rm -f ~/.ssh/id_deploy
            exit 0
          fi
          if [ "$MODE" = data-checks ]; then
            tool data_checks.php | $S "$FIND; php"
            rm -f ~/.ssh/id_deploy
            exit 0
          fi
          if [ "$MODE" = promises ]; then
            tool promises_inspect.php | $S "$FIND; php"
            rm -f ~/.ssh/id_deploy
            exit 0
          fi
          if [ "$MODE" = join-check ]; then
            printf '%s' "$MEMBER" | grep -qE '^[A-Za-z0-9._%+@-]*$' || { echo "member must be an email or a member id"; exit 1; }
            tool join_check.php | $S "$FIND; LIMIT=40 MEMBER='$MEMBER' nice php"
            rm -f ~/.ssh/id_deploy
            exit 0
          fi
          if [ "$MODE" = speech-rates ]; then
            tool speech_rates.php | $S "$FIND; php"
            rm -f ~/.ssh/id_deploy
            exit 0
          fi
          if [ "$MODE" = plan-lines ] || [ "$MODE" = plan-lines-apply ]; then
            tool plan_lines.php | $S "$FIND; APPLY=$([ "$MODE" = plan-lines-apply ] && echo 1 || echo 0) php"
            rm -f ~/.ssh/id_deploy
            exit 0
          fi
          if [ "$MODE" = owner-todo ]; then
            tool owner_todo.php | $S "$FIND; php"
            rm -f ~/.ssh/id_deploy
            exit 0
          fi
          if [ "$MODE" = speed-check ]; then
            printf '%s' "$MEMBER" | grep -qE '^[A-Za-z0-9._%+@-]*$' || { echo "member must be an email or a member id"; exit 1; }
            tool speed_check.php | $S "$FIND; MEMBER='$MEMBER' nice php"
            rm -f ~/.ssh/id_deploy
            exit 0
          fi
          if [ "$MODE" = demo-links ]; then
            printf '%s' "$MEMBER" | grep -qE '^[A-Za-z0-9._%+@-]+$' || { echo "member must be an email or a member id"; exit 1; }
            tool demo_link_check.php | $S "$FIND; MEMBER='$MEMBER' php"
            rm -f ~/.ssh/id_deploy
            exit 0
          fi
          if [ "$MODE" = email-check ]; then
            printf '%s' "$MEMBER" | grep -qE '^[A-Za-z0-9._%+@-]*$' || { echo "member must be an email or a member id"; exit 1; }
            tool email_check.php | $S "$FIND; MEMBER='$MEMBER' php"
            rm -f ~/.ssh/id_deploy
            exit 0
          fi
          if [ "$MODE" = page-check ]; then
            [ "$TARGET" = staging ] || { echo "page-check runs on staging only"; exit 1; }
            failed=0
            for l in en ar; do
              $S "$FIND; LOCALE=$l php" < scripts/support/staging_page_check.php || failed=1
            done
            rm -f ~/.ssh/id_deploy
            exit "$failed"
          fi
          if [ "$MODE" = indexnow ]; then
            $S "$FIND; php artisan seo:indexnow"
            rm -f ~/.ssh/id_deploy
            exit 0
          fi
          if [ "$MODE" = ffmpeg ]; then
            case "$($S 'uname -m')" in
              x86_64) A=amd64 ;; aarch64|arm64) A=arm64 ;; *) echo "Unknown CPU type"; exit 1 ;;
            esac
            B="https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-$A-static.tar.xz"
            curl -fsSL --retry 3 -o ff.tar.xz "$B"
            curl -fsSL --retry 3 "$B.md5" | awk '{print $1"  ff.tar.xz"}' | md5sum -c -
            tar -xJf ff.tar.xz --wildcards --strip-components=1 '*/ffmpeg'
            ./ffmpeg -hide_banner -encoders | grep -q libmp3lame
            $S "$FIND; mkdir -p storage/app/bin && cat > storage/app/bin/ffmpeg.new" < ffmpeg
            $S "$FIND; set -e; chmod 755 storage/app/bin/ffmpeg.new; storage/app/bin/ffmpeg.new -hide_banner -version | head -1; \
              mv storage/app/bin/ffmpeg.new storage/app/bin/ffmpeg; \
              php artisan cache:forget audio_formats.encoders >/dev/null 2>&1 || true; \
              php artisan queue:restart | tail -1 || true; echo 'INSTALLED: storage/app/bin/ffmpeg'"
            rm -f ~/.ssh/id_deploy
            exit 0
          fi
          if [ "$MODE" = dub-test ]; then
            [ "$TARGET" = staging ] || { echo "dub-test runs on staging only"; exit 1; }
            printf '%s' "$DUB" | grep -qE '^[A-Za-z0-9_= .-]*$' || { echo "dub: only name=value pairs, or clean"; exit 1; }
            T=storage/app/listen-deploy/dub-test
            if [ "$DUB" = clean ]; then
              $S "$FIND; rm -rf $T" && echo "The test video and its dub are gone from staging."
              rm -f ~/.ssh/id_deploy
              exit 0
            fi
            $S "$FIND; mkdir -p $T && chmod 700 $T"
            if [ -f tests/dub-test/source.mp4 ]; then
              $S "$FIND; cat > $T/source.mp4" < tests/dub-test/source.mp4
              echo "Test video sent: $(stat -c %s tests/dub-test/source.mp4) bytes."
            fi
            failed=0
            tool dub_test.php | $S "$FIND; DUB='$DUB' nice php" || failed=1
            mkdir -p dub-test
            $S "$FIND; cat $T/report.json" > dub-test/report.json 2>/dev/null || rm -f dub-test/report.json
            $S "$FIND; test -f $T/dub.mp4 && cat $T/dub.mp4" > dub-test/dub.mp4 2>/dev/null || rm -f dub-test/dub.mp4
            ls -l dub-test
            rm -f ~/.ssh/id_deploy
            exit "$failed"
          fi
          if [ "$MODE" = voice-design-test ]; then
            [ "$TARGET" = staging ] || { echo "voice-design-test runs on staging only"; exit 1; }
            printf '%s' "$DESIGN" | grep -qE '^[a-z_]*$' || { echo "design: an example key such as cairo_grandma"; exit 1; }
            failed=0
            tool voice_design_test.php | $S "$FIND; VD='$DESIGN' php" || failed=1
            mkdir -p voice-design-test
            for t in 1 2 3; do $S "$FIND; cat storage/app/listen-deploy/voice-design-test/take-$t.* 2>/dev/null" > voice-design-test/take-$t.mp3 || true; [ -s voice-design-test/take-$t.mp3 ] || rm -f voice-design-test/take-$t.mp3; done
            ls -l voice-design-test
            rm -f ~/.ssh/id_deploy
            exit "$failed"
          fi
          if [ "$MODE" = voice-cloning-examples ]; then
            [ "$TARGET" = staging ] || { echo "voice-cloning-examples runs on staging only"; exit 1; }
            failed=0
            tool voice_cloning_examples.php | $S "$FIND; php" || failed=1
            mkdir -p voice-cloning-examples
            for l in ar en; do $S "$FIND; cat storage/app/listen-deploy/voice-cloning-examples/$l.mp3 2>/dev/null" > voice-cloning-examples/$l.mp3 || true; [ -s voice-cloning-examples/$l.mp3 ] || rm -f voice-cloning-examples/$l.mp3; done
            ls -l voice-cloning-examples
            rm -f ~/.ssh/id_deploy
            exit "$failed"
          fi
          if [ "$MODE" = voice-design-log ]; then
            $S "$FIND; grep -h 'Voice design:' \$(ls -t storage/logs/*.log 2>/dev/null | head -3) 2>/dev/null | tail -n 30 | cut -c1-700" || echo "No Voice Design lines in the logs."
            rm -f ~/.ssh/id_deploy
            exit 0
          fi
          if [ "$MODE" != deploy ]; then exit 0; fi
          $S "$FIND; cat > storage/app/listen-deploy/bundle.tgz" < bundle.tgz
          # In bash with pipefail, so anything that fails stops the deploy and fails the run.
          $S "$FIND; DEPLOY_REF='$DEPLOY_REF' bash -s" <<'REMOTE'
          set -euo pipefail
          trap 'rm -f storage/app/listen-deploy/bundle.tgz' EXIT
          # One artisan step: its last lines when it works, all of its output (artisan
          # prints errors there too) and a FAILED line when it does not.
          step() {
            local lines="$1" out; shift
            if ! out="$(php artisan "$@" 2>&1)"; then
              printf '%s\n' "$out"; echo "DEPLOY FAILED at: php artisan $*"; exit 1
            fi
            printf '%s\n' "$out" | tail -n "$lines"
          }
          tar -xzf storage/app/listen-deploy/bundle.tgz --no-same-owner --no-overwrite-dir
          c=0; [ -f bootstrap/cache/config.php ] && c=1
          r=0; [ -f bootstrap/cache/routes-v7.php ] && r=1
          # The app cache stays: it holds the Stripe webhook and email de-duplication,
          # the daily spend ceilings, rate limits and the keys' "out for today" markers.
          step 6 optimize:clear --except=cache
          # The /en and /ar routes have their own cache files (mcamara/laravel-localization).
          # Clear them every time, and cache routes only with route:trans:cache: plain
          # route:cache leaves out the language prefix, so every /en and /ar page 404s.
          step 1 route:trans:clear
          if [ "$c" = 1 ]; then step 1 config:cache; fi
          if [ "$r" = 1 ]; then step 1 route:trans:cache; fi
          step 1 view:cache
          php artisan queue:restart | tail -1 || true
          md5sum -c --quiet storage/app/listen-deploy/manifest.md5 >/dev/null 2>&1 && echo "DEPLOYED: every file matches $DEPLOY_REF" || echo 'WARNING: some files still differ'
          REMOTE
          rm -f ~/.ssh/id_deploy
      - name: Keep the test dub with the run
        if: always() && inputs.mode == 'dub-test'
        uses: actions/upload-artifact@v4
        with:
          name: dub-test
          path: dub-test/
          if-no-files-found: ignore
          retention-days: 3
      - name: Keep the test design's takes with the run
        if: always() && inputs.mode == 'voice-design-test'
        uses: actions/upload-artifact@v4
        with:
          name: voice-design-test
          path: voice-design-test/
          if-no-files-found: ignore
          retention-days: 3
      - name: Keep the cloning examples with the run
        if: always() && inputs.mode == 'voice-cloning-examples'
        uses: actions/upload-artifact@v4
        with:
          name: voice-cloning-examples
          path: voice-cloning-examples/
          if-no-files-found: ignore
          retention-days: 3
      - name: Check the public footer
        env:
          BASE: ${{ inputs.target == 'live' && 'https://listenai.studio' || 'https://phplaravel-1516130-6707450.cloudwaysapps.com' }}
        run: |
          failed=0
          for path in /ar /en; do
            html="$(curl -s --max-time 30 -L "$BASE$path" || true)"
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 -L "$BASE$path" || echo 000)"
            echo "$path: HTTP $code, footer columns: $(printf '%s' "$html" | grep -o 'class="footer-column"' | wc -l), dialect page links in page: $(printf '%s' "$html" | grep -o 'arabic-dialects/[a-z-]*"' | wc -l), hub links: $(printf '%s' "$html" | grep -oE '/(arabic-dialects|english-accents)"' | sort -u | tr '\n' ' ')"
            # Either home page not loading fails the run, so a broken deploy is not missed.
            [ "$code" = 200 ] || { echo "::error::$BASE$path answered HTTP $code"; failed=1; }
          done
          # Text the server could not find shows as its key ("ui.pricing.team_title"); list any.
          for path in /ar /en /ar/pricing /en/pricing; do
            keys="$(curl -s --max-time 30 -L "$BASE$path" | grep -oE '>[[:space:]]*ui\.[a-z0-9_]+\.[a-z0-9_.]+' | sed 's/^>[[:space:]]*//' | sort -u | tr '\n' ' ' || true)"
            echo "$path: untranslated keys: ${keys:-none}"
          done
          exit "$failed"
      - name: The public pages' text
        if: inputs.mode == 'promises'
        env:
          BASE: ${{ inputs.target == 'live' && 'https://listenai.studio' || 'https://phplaravel-1516130-6707450.cloudwaysapps.com' }}
        run: |
          for path in /en /ar /en/pricing /ar/pricing /en/developers /en/browsers-extension /ar/browsers-extension /en/voice-samples; do
            echo "===== $path ====="
            curl -s --max-time 30 -L "$BASE$path" | python3 -c '
          import re, sys
          from html.parser import HTMLParser
          class Text(HTMLParser):
              skip = {"script", "style", "noscript", "svg", "template"}
              def __init__(self):
                  super().__init__(); self.depth = 0; self.out = []
              def handle_starttag(self, tag, attrs):
                  if tag in self.skip: self.depth += 1
                  elif tag in ("p", "li", "h1", "h2", "h3", "h4", "div", "br", "tr", "section", "button", "a"): self.out.append("\n")
              def handle_endtag(self, tag):
                  if tag in self.skip and self.depth: self.depth -= 1
              def handle_data(self, data):
                  if not self.depth: self.out.append(data)
          t = Text(); t.feed(sys.stdin.read())
          lines = [re.sub(r"\s+", " ", l).strip() for l in "".join(t.out).split("\n")]
          print("\n".join(l for l in lines if l)[:20000])
          '
          done
