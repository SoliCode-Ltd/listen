name: Server deploy

# inspect: read-only look at the app checkout on the server.
# deploy: fast-forward the checkout to origin/main, refresh dependencies only
# if composer.lock changed, list (never run) new migrations, clear caches.
# Stops without changing anything if the checkout has local edits or cannot
# fast-forward.

on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [staging, live]
        default: staging
      mode:
        type: choice
        options: [inspect, deploy]
        default: inspect

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run over SSH
        env:
          TARGET: ${{ inputs.target }}
          MODE: ${{ inputs.mode }}
          LIVE_HOST: ${{ secrets.LIVE_SSH_HOST }}
          LIVE_USER: ${{ secrets.LIVE_SSH_USER }}
          LIVE_KEY: ${{ secrets.LIVE_SSH_KEY }}
          LIVE_PATH: ${{ secrets.LIVE_APP_PATH }}
          STAGING_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_PATH: ${{ secrets.STAGING_APP_PATH }}
        run: |
          set -euo pipefail
          if [ "$TARGET" = live ]; then H="$LIVE_HOST"; U="$LIVE_USER"; K="$LIVE_KEY"; P="$LIVE_PATH"; else H="$STAGING_HOST"; U="$STAGING_USER"; K="$STAGING_KEY"; P="$STAGING_PATH"; fi
          H="$(printf '%s' "$H" | tr -d '[:space:]')"; U="$(printf '%s' "$U" | tr -d '[:space:]')"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$K" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -T 15 -H "$H" >> ~/.ssh/known_hosts 2>/dev/null
          cat > remote.sh <<'SH'
          set -u
          for d in __PATH__ ~/public_html ~; do [ -f "$d/artisan" ] && cd "$d" && break; done
          echo "APP DIR: $(pwd)"
          if ! git rev-parse --is-inside-work-tree >/dev/null 2>&1; then echo "NOT A GIT CHECKOUT"; ls -la | head -30; exit 0; fi
          echo "BRANCH: $(git rev-parse --abbrev-ref HEAD)"
          echo "HEAD: $(git log -1 --format='%h %s (%cr)')"
          echo "REMOTE: $(git remote -v | head -1 | sed -E 's#//[^@]*@#//***@#')"
          echo "LOCAL CHANGES:"; git status --porcelain --untracked-files=no | head -40
          git fetch -q origin main 2>&1 | tail -3 || echo "FETCH FAILED"
          echo "BEHIND main BY: $(git rev-list --count HEAD..origin/main 2>/dev/null)"
          git log --oneline HEAD..origin/main 2>/dev/null | head -20
          echo "AHEAD OF main BY: $(git rev-list --count origin/main..HEAD 2>/dev/null)"
          echo "NEW MIGRATIONS:"; git diff --name-only HEAD origin/main -- database/migrations 2>/dev/null
          echo "COMPOSER.LOCK CHANGED: $(git diff --quiet HEAD origin/main -- composer.lock && echo no || echo yes)"
          if [ "__MODE__" != deploy ]; then exit 0; fi
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then echo "STOPPED: local edits on the server; nothing changed"; exit 3; fi
          old="$(git rev-parse HEAD)"
          git merge --ff-only origin/main || { echo "STOPPED: cannot fast-forward; nothing changed"; exit 4; }
          if ! git diff --quiet "$old" HEAD -- composer.lock; then composer install --no-dev --optimize-autoloader --no-interaction 2>&1 | tail -5; fi
          php artisan optimize:clear 2>&1 | tail -8
          php artisan config:cache 2>&1 | tail -2
          php artisan route:cache 2>&1 | tail -2
          php artisan view:cache 2>&1 | tail -2
          php artisan queue:restart 2>&1 | tail -1 || true
          echo "DEPLOYED: $(git log -1 --format='%h %s')"
          echo "MIGRATIONS NOT RUN (run by hand if any): $(git diff --name-only "$old" HEAD -- database/migrations | tr '\n' ' ')"
          SH
          sed -i "s#__PATH__#${P:+$P}#; s#__MODE__#$MODE#" remote.sh
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o ConnectTimeout=20 "$U@$H" 'bash -s' < remote.sh
          rm -f ~/.ssh/id_deploy
