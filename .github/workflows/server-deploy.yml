name: Server deploy

# The servers are plain uploads, not git checkouts. This copies the files
# tracked on main onto the server (staging: on the branch the run was started
# from, so a branch can be tried there before it is merged; live: always main). It never deletes, and never touches .env,
# storage/, vendor/, node_modules/, uploads, or the per-server extension
# config (public/extensions/*/config.js).
#   inspect: lists the files that differ from what would be deployed (nothing changes).
#   deploy:  copies main over the app, then clears and rebuilds caches.
#   ffmpeg:  puts a static ffmpeg in storage/app/bin (for the sound
#            environments and download formats) when the host has none.
#   migrate: lists the pending migrations, then runs them (php artisan
#            migrate --force). Only when the owner asks; deploy first.
#   indexnow: tells Bing, Yandex, Naver and Seznam about every public page
#            (php artisan seo:indexnow). Run on live after a deploy that adds pages.
#   queue:   shows how the queue workers run, then makes sure a job is never
#            handed to a second worker while the first is still on it: sets
#            DB_QUEUE_RETRY_AFTER=180 in .env (above the 150 s job limit; the
#            old .env is kept in storage/app/listen-deploy), rebuilds the config
#            cache and restarts the workers.
#   billing-trace: read-only. For one Stripe customer (input "customer"),
#            prints the plans' Stripe prices, the member's local billing rows
#            and their log lines, plus every local subscription whose price
#            no plan knows any more. Writes nothing; prints no names or emails.
#   plan-audit: read-only. Every member on a paid plan with no card
#            subscription: how the plan is saved, whether anything was paid
#            for it, and whether it needs a look. Writes nothing; prints
#            member ids only.
# New migrations and composer.lock changes are reported, not run.

on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [staging, live]
        default: staging
      mode:
        type: choice
        options: [inspect, deploy, ffmpeg, indexnow, migrate, queue, billing-trace, plan-audit]
        default: inspect
      customer:
        description: "billing-trace only: the Stripe customer id (cus_...)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Live always gets main. Staging gets the branch this run was started from
          # (main when started from main), to try work there before it is merged.
          ref: ${{ inputs.target == 'live' && 'main' || github.ref_name }}
          fetch-depth: 1
      - name: Build the bundle and its checksums
        run: |
          set -euo pipefail
          git ls-files | grep -v -E '^(\.github/|tests/|marketing/|\.env|storage/|vendor/|node_modules/|public/storage)' \
            | grep -v -E '(^|/)\.git(ignore|attributes)$|^public/extensions/[^/]+/config\.js$' > files.txt
          tar -czf bundle.tgz -T files.txt
          xargs -d '\n' md5sum < files.txt > manifest.md5
          echo "${{ inputs.target == 'live' && 'main' || github.ref_name }}: $(git log -1 --format='%h %s')"; wc -l < files.txt
      - name: Run over SSH
        env:
          TARGET: ${{ inputs.target }}
          MODE: ${{ inputs.mode }}
          CUSTOMER: ${{ inputs.customer }}
          LIVE_HOST: ${{ secrets.LIVE_SSH_HOST }}
          LIVE_USER: ${{ secrets.LIVE_SSH_USER }}
          LIVE_KEY: ${{ secrets.LIVE_SSH_KEY }}
          LIVE_PATH: ${{ secrets.LIVE_APP_PATH }}
          STAGING_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_PATH: ${{ secrets.STAGING_APP_PATH }}
        run: |
          set -euo pipefail
          if [ "$TARGET" = live ]; then H="$LIVE_HOST"; U="$LIVE_USER"; K="$LIVE_KEY"; P="$LIVE_PATH"; else H="$STAGING_HOST"; U="$STAGING_USER"; K="$STAGING_KEY"; P="$STAGING_PATH"; fi
          H="$(printf '%s' "$H" | tr -d '[:space:]')"; U="$(printf '%s' "$U" | tr -d '[:space:]')"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$K" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -T 15 -H "$H" >> ~/.ssh/known_hosts 2>/dev/null
          S="ssh -i $HOME/.ssh/id_deploy -o BatchMode=yes -o ConnectTimeout=20 $U@$H"
          FIND="for d in ${P:+'$P'} ~/public_html ~; do [ -f \"\$d/artisan\" ] && cd \"\$d\" && break; done"
          $S "$FIND; mkdir -p storage/app/listen-deploy"
          $S "$FIND; cat > storage/app/listen-deploy/manifest.md5" < manifest.md5
          echo "== Files that differ from ${{ inputs.target == 'live' && 'main' || github.ref_name }} (or are missing) =="
          $S "$FIND; md5sum -c --quiet storage/app/listen-deploy/manifest.md5 2>/dev/null | sed 's/: FAILED open or read/  (missing)/; s/: FAILED$/  (changed)/' | grep -v '^md5sum' | sort" | tee diff.txt || true
          echo "== $(wc -l < diff.txt) file(s) =="
          echo "New or changed migrations:"; grep '^database/migrations/' diff.txt || echo "  none"
          echo "composer.lock:"; grep -q '^composer.lock' diff.txt && echo "  CHANGED: run composer install by hand" || echo "  same"
          echo "ffmpeg (sound environments, download formats):"
          $S "$FIND; bash -s" <<'REMOTE' || true
          f="$(command -v ffmpeg || true)"; [ -x storage/app/bin/ffmpeg ] && f="$f storage/app/bin/ffmpeg"
          e="$(grep -E '^FFMPEG_PATH=' .env 2>/dev/null || true)"
          echo "  found: ${f:-NONE (run this workflow with mode ffmpeg)} ${e}"
          php -r 'echo "  PHP proc_open (command line): ", function_exists("proc_open") && stripos((string) ini_get("disable_functions"), "proc_open") === false ? "allowed" : "DISABLED", PHP_EOL;'
          REMOTE
          if [ "$MODE" = migrate ]; then
            $S "$FIND; php artisan migrate:status --pending 2>/dev/null || php artisan migrate:status | grep -i pending || true"
            $S "$FIND; php artisan migrate --force"
            rm -f ~/.ssh/id_deploy
            exit 0
          fi
          if [ "$MODE" = billing-trace ]; then
            printf '%s' "$CUSTOMER" | grep -qE '^cus_[A-Za-z0-9]+$' || { echo "customer must look like cus_..."; exit 1; }
            $S "$FIND; CUSTOMER='$CUSTOMER' php" <<'REMOTE'
          <?php
          require 'vendor/autoload.php';
          $app = require 'bootstrap/app.php';
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $db = fn (string $t) => Illuminate\Support\Facades\DB::table($t);
          $show = function (string $title, $rows) { echo "== $title ==\n"; foreach ($rows as $r) echo '  ', json_encode($r, JSON_UNESCAPED_SLASHES), "\n"; if (count($rows) === 0) echo "  none\n"; };
          echo 'App timezone: ', config('app.timezone'), "\n";
          $plans = $db('plans')->select('id', 'slug', 'price_cents', 'is_active', 'stripe_price_monthly', 'stripe_price_yearly', 'updated_at')->orderBy('id')->get();
          $show('Plans and their Stripe prices', $plans);
          $known = $plans->flatMap(fn ($p) => [$p->stripe_price_monthly, $p->stripe_price_yearly])->filter()->values()->all();
          $users = $db('users')->where('stripe_id', getenv('CUSTOMER'))->select('id', 'created_at', 'stripe_id', 'pm_type', 'pm_last_four', 'subscription_status_checked_at')->get();
          $show('Members with this Stripe customer', $users);
          foreach ($users as $u) {
              $show("billing_subscriptions of member {$u->id}", $db('billing_subscriptions')->where('user_id', $u->id)->orderBy('id')->get());
              $show("plan subscriptions of member {$u->id}", $db('subscriptions')->where('user_id', $u->id)->orderBy('id')->get());
          }
          $show('Local Stripe subscriptions on a price no plan knows (all members)', $db('billing_subscriptions')->whereNotNull('stripe_price')->whereNotIn('stripe_price', $known)->select('id', 'user_id', 'stripe_id', 'stripe_status', 'stripe_price', 'created_at', 'updated_at', 'ends_at')->orderBy('id')->get());
          REMOTE
            for u in $($S "$FIND; CUSTOMER='$CUSTOMER' php -r 'require \"vendor/autoload.php\"; \$a = require \"bootstrap/app.php\"; \$a->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap(); echo Illuminate\Support\Facades\DB::table(\"users\")->where(\"stripe_id\", getenv(\"CUSTOMER\"))->pluck(\"id\")->implode(\" \");'"); do
              echo "== Log lines for member $u (Oct 15-17) =="
              $S "$FIND; grep -hE '^\[2026-10-1[5-7]' storage/logs/*.log 2>/dev/null | grep -E \"\\\"user_id\\\":$u[,}]\" | cut -c1-400 | tail -60" || echo "  none"
            done
            rm -f ~/.ssh/id_deploy
            exit 0
          fi
          if [ "$MODE" = plan-audit ]; then
            $S "$FIND; php" <<'REMOTE'
          <?php
          require 'vendor/autoload.php';
          $app = require 'bootstrap/app.php';
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $db = fn (string $t) => Illuminate\Support\Facades\DB::table($t);
          $now = now()->toDateTimeString();
          echo "Now (UTC): $now\n";
          $paidPlans = $db('plans')->where('price_cents', '>', 0)->where(fn ($q) => $q->where('kind', 'subscription')->orWhereNull('kind'))->pluck('slug', 'id');
          // A member's plan is their newest plan row.
          $latest = $db('subscriptions')->selectRaw('max(id) as id')->groupBy('user_id')->pluck('id');
          $rows = $db('subscriptions')->whereIn('id', $latest)->where('status', 'active')->whereIn('plan_id', $paidPlans->keys())->orderBy('user_id')->get();
          $totals = [];
          echo "== Members on a paid plan with no card subscription ==\n";
          foreach ($rows as $r) {
              $card = $db('billing_subscriptions')->where('user_id', $r->user_id)->whereNotIn('stripe_status', ['canceled', 'incomplete_expired'])->exists();
              if ($card) { $totals['on a card subscription (not listed)'] = ($totals['on a card subscription (not listed)'] ?? 0) + 1; continue; }
              $stripeCustomer = trim((string) $db('users')->where('id', $r->user_id)->value('stripe_id')) !== '';
              $approved = $db('manual_payment_requests')->where('user_id', $r->user_id)->where('plan_id', $r->plan_id)->where('status', 'approved')->orderByDesc('id')->get(['reviewed_at', 'billing_cycle']);
              $otherOverride = $db('subscriptions')->where('user_id', $r->user_id)->where('id', '!=', $r->id)->where('status', 'active')->where('billing_payment_state', 'manual_override')->exists();
              $state = (string) $r->billing_payment_state;
              $ended = $r->current_period_end !== null && $r->current_period_end < $now;
              $source = $approved->isNotEmpty() ? 'paid by InstaPay / Vodafone Cash' : 'given by the team';
              $verdict = match (true) {
                  $state === 'manual_override' => 'OK, kept as set',
                  $ended => 'ended',
                  $stripeCustomer && $otherOverride => 'CHECK: saved as '.$state.', kept only because an older row is Manual Override',
                  $stripeCustomer => 'CHECK: saved as '.$state.', has a Stripe customer',
                  default => 'CHECK: saved as '.$state.', end date was pushed a month from each visit until today',
              };
              $totals[$source.' / '.$verdict] = ($totals[$source.' / '.$verdict] ?? 0) + 1;
              echo '  ', json_encode([
                  'member' => $r->user_id, 'plan' => $paidPlans[$r->plan_id], 'saved_as' => $state,
                  'period_start' => $r->current_period_start, 'period_end' => $r->current_period_end,
                  'row_created' => $r->created_at, 'row_updated' => $r->updated_at, 'stripe_customer' => $stripeCustomer,
                  'approved_payments_for_plan' => $approved->count(), 'last_approved' => $approved->first()->reviewed_at ?? null,
                  'source' => $source, 'verdict' => $verdict,
              ], JSON_UNESCAPED_SLASHES), "\n";
          }
          echo "== Totals ==\n";
          foreach ($totals as $k => $n) echo "  $k: $n\n";
          if ($totals === []) echo "  none\n";
          REMOTE
            rm -f ~/.ssh/id_deploy
            exit 0
          fi
          if [ "$MODE" = queue ]; then
            $S "$FIND; bash -s" <<'REMOTE'
          set -e
          echo "== Queue workers running now =="
          ps -eo pid,etime,args | grep -E 'artisan (queue:(work|listen)|horizon)' | grep -v grep || echo "  none right now"
          echo "== Cron lines that start Laravel =="
          crontab -l 2>/dev/null | grep -E 'artisan|queue' || echo "  none in this user's crontab"
          echo "== Queue settings in .env (before) =="
          grep -E '^(QUEUE_CONNECTION|DB_QUEUE[A-Z_]*|REDIS_QUEUE[A-Z_]*)=' .env || echo "  none (defaults)"
          b="storage/app/listen-deploy/env.backup-$(date -u +%Y%m%d%H%M%S)"
          cp .env "$b" && chmod 600 "$b" && echo "  old .env kept as $b"
          if grep -q '^DB_QUEUE_RETRY_AFTER=' .env; then sed -i 's/^DB_QUEUE_RETRY_AFTER=.*/DB_QUEUE_RETRY_AFTER=180/' .env; else printf '\nDB_QUEUE_RETRY_AFTER=180\n' >> .env; fi
          echo "== After =="
          grep -E '^DB_QUEUE_RETRY_AFTER=' .env
          [ -f bootstrap/cache/config.php ] && php artisan config:cache | tail -1
          php artisan queue:restart | tail -1
          echo "== In use =="
          php artisan config:show queue.connections.database 2>/dev/null | grep -iE 'retry_after' || echo "  (could not read the config)"
          REMOTE
            rm -f ~/.ssh/id_deploy
            exit 0
          fi
          if [ "$MODE" = indexnow ]; then
            $S "$FIND; php artisan seo:indexnow"
            rm -f ~/.ssh/id_deploy
            exit 0
          fi
          if [ "$MODE" = ffmpeg ]; then
            case "$($S 'uname -m')" in
              x86_64) A=amd64 ;; aarch64|arm64) A=arm64 ;; *) echo "Unknown CPU type"; exit 1 ;;
            esac
            B="https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-$A-static.tar.xz"
            curl -fsSL --retry 3 -o ff.tar.xz "$B"
            curl -fsSL --retry 3 "$B.md5" | awk '{print $1"  ff.tar.xz"}' | md5sum -c -
            tar -xJf ff.tar.xz --wildcards --strip-components=1 '*/ffmpeg'
            ./ffmpeg -hide_banner -encoders | grep -q libmp3lame
            $S "$FIND; mkdir -p storage/app/bin && cat > storage/app/bin/ffmpeg.new" < ffmpeg
            $S "$FIND; set -e; chmod 755 storage/app/bin/ffmpeg.new; storage/app/bin/ffmpeg.new -hide_banner -version | head -1; \
              mv storage/app/bin/ffmpeg.new storage/app/bin/ffmpeg; \
              php artisan cache:forget audio_formats.encoders >/dev/null 2>&1 || true; \
              php artisan queue:restart | tail -1 || true; echo 'INSTALLED: storage/app/bin/ffmpeg'"
            rm -f ~/.ssh/id_deploy
            exit 0
          fi
          if [ "$MODE" != deploy ]; then exit 0; fi
          $S "$FIND; cat > storage/app/listen-deploy/bundle.tgz" < bundle.tgz
          $S "$FIND; set -e; tar -xzf storage/app/listen-deploy/bundle.tgz --no-same-owner --no-overwrite-dir; \
            c=0; [ -f bootstrap/cache/config.php ] && c=1; r=0; [ -f bootstrap/cache/routes-v7.php ] && r=1; \
            php artisan optimize:clear | tail -6; \
            [ \$c = 1 ] && php artisan config:cache | tail -1; [ \$r = 1 ] && php artisan route:cache | tail -1; \
            php artisan view:cache | tail -1; php artisan queue:restart | tail -1 || true; \
            md5sum -c --quiet storage/app/listen-deploy/manifest.md5 >/dev/null 2>&1 && echo 'DEPLOYED: every file matches ${{ inputs.target == 'live' && 'main' || github.ref_name }}' || echo 'WARNING: some files still differ'; \
            rm -f storage/app/listen-deploy/bundle.tgz"
          rm -f ~/.ssh/id_deploy
      - name: Check the public footer
        env:
          BASE: ${{ inputs.target == 'live' && 'https://listenai.studio' || 'https://phplaravel-1516130-6707450.cloudwaysapps.com' }}
        run: |
          for path in /ar /en; do
            html="$(curl -s --max-time 30 -L "$BASE$path" || true)"
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 -L "$BASE$path" || echo 000)"
            echo "$path: HTTP $code, footer columns: $(printf '%s' "$html" | grep -o 'class="footer-column"' | wc -l), dialect page links in page: $(printf '%s' "$html" | grep -o 'arabic-dialects/[a-z-]*"' | wc -l), hub links: $(printf '%s' "$html" | grep -oE '/(arabic-dialects|english-accents)"' | sort -u | tr '\n' ' ')"
          done
          # Text the server could not find shows as its key ("ui.pricing.team_title"); list any.
          for path in /ar /en /ar/pricing /en/pricing; do
            keys="$(curl -s --max-time 30 -L "$BASE$path" | grep -oE '>[[:space:]]*ui\.[a-z0-9_]+\.[a-z0-9_.]+' | sed 's/^>[[:space:]]*//' | sort -u | tr '\n' ' ' || true)"
            echo "$path: untranslated keys: ${keys:-none}"
          done
