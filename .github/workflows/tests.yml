name: Tests

# Runs the full test suite on every pull request and on pushes to main, on the
# same PHP version as the servers. A red run means something the tests protect
# (billing, sign-in, quotas, abuse rules, TTS routing, admin stats) has changed.

on:
  pull_request:
  push:
    branches: [main, claude/clever-darwin-qt43hw, claude/elegant-ptolemy-nsecia]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, intl, mbstring, pdo_sqlite, sqlite3, gd, zip
          coverage: none

      # The app converts Gemini WAV output to MP3 with ffmpeg, as on the servers.
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run tests
        run: php artisan test
