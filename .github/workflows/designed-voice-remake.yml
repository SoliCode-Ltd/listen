name: Designed voices re-made on a free key (LIVE, writes)

# WRITES ON LIVE: scripts/support/designed_voice_remake.php piped into the app's
# PHP over SSH. Re-makes the listed designed voices on a free speech key and keeps
# the originals. A voice that has already moved is skipped, so a second run is safe.

on:
  workflow_dispatch:
  push:
    branches: [solicode/nifty-knuth-gq5141]
    paths:
      - .github/workflows/designed-voice-remake.yml
      - scripts/support/designed_voice_remake.php

permissions:
  contents: read

jobs:
  remake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Re-make the voices on live over SSH
        env:
          SSH_HOST: ${{ secrets.LIVE_SSH_HOST }}
          SSH_USER: ${{ secrets.LIVE_SSH_USER }}
          SSH_KEY: ${{ secrets.LIVE_SSH_KEY }}
          APP_PATH: ${{ secrets.LIVE_APP_PATH }}
        run: |
          set -euo pipefail
          SSH_HOST="$(printf '%s' "$SSH_HOST" | tr -d '[:space:]')"
          SSH_USER="$(printf '%s' "$SSH_USER" | tr -d '[:space:]')"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_inspect
          chmod 600 ~/.ssh/id_inspect
          ssh-keyscan -T 15 -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          remote="for d in ${APP_PATH:+'$APP_PATH'} ~/public_html ~; do [ -f \"\$d/artisan\" ] && cd \"\$d\" && break; done; php"
          ssh -i ~/.ssh/id_inspect -o BatchMode=yes -o ConnectTimeout=20 "$SSH_USER@$SSH_HOST" "$remote" < scripts/support/designed_voice_remake.php
          rm -f ~/.ssh/id_inspect
