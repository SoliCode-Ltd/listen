name: Tag audio check

# Live check on STAGING that sound tags are performed, through the real
# stock and cloned-voice services, with a Gemini model listening to each
# result. Run by hand only (it uses Gemini requests on the speech quota
# staging shares with live), when the owner has said yes. Uploads the audio.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run on staging over SSH
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          APP_PATH: ${{ secrets.STAGING_APP_PATH }}
        run: |
          set -euo pipefail
          SSH_HOST="$(printf '%s' "$SSH_HOST" | tr -d '[:space:]')"
          SSH_USER="$(printf '%s' "$SSH_USER" | tr -d '[:space:]')"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_check
          chmod 600 ~/.ssh/id_check
          ssh-keyscan -T 15 -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          remote="for d in ${APP_PATH:+'$APP_PATH'} ~/public_html ~; do [ -f \"\$d/artisan\" ] && cd \"\$d\" && break; done; php"
          ssh -i ~/.ssh/id_check -o BatchMode=yes -o ConnectTimeout=20 "$SSH_USER@$SSH_HOST" "$remote" < scripts/tts/tag_audio_check.php > result.json
          rm -f ~/.ssh/id_check
      - name: Summarise
        run: |
          mkdir -p audio
          python3 - <<'PY'
          import json, base64, re
          d = json.load(open('result.json'))
          print(d['meta'])
          for c in d['cases']:
              a = c.pop('audio_base64', None)
              if a:
                  ext = '.wav' if base64.b64decode(a)[:4] == b'RIFF' else '.mp3'
                  open('audio/' + re.sub(r'[^A-Za-z0-9]+', '_', c['name']) + ext, 'wb').write(base64.b64decode(a))
              print('\n===', c['name'])
              print(json.dumps(c, ensure_ascii=False, indent=1))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tag-audio-check-${{ github.run_number }}
          path: audio/
          if-no-files-found: ignore
          retention-days: 14
